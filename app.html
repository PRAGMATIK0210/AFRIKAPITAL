<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AFRIKAPITAL — Gestion de crédit</title>
<meta name="theme-color" content="#0e7c86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AFRIKAPITAL">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--teal:#0f6466;--teal-d:#0b4c4e;--teal-l:#e2f0ef;--gold:#b5822b;--gold-l:#f6edda;--green:#1f9d55;--green-l:#e3f5ea;--red:#d64545;--red-l:#fbe6e6;--ink:#17212e;--muted:#64748b;--line:#e2e8f0;--bg:#eef1f4;--surface-2:#f7f9fb}
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
input,select,button{font-family:inherit}
/* LOGIN */
.login{max-width:460px;margin:0 auto;padding:30px 16px}
.brand{display:flex;align-items:center;gap:12px;justify-content:center;margin:20px 0}
.logo{width:48px;height:48px;border-radius:13px;background:var(--gold);display:grid;place-items:center;font-weight:800;color:#23180a;font-size:24px}
.brand b{font-size:19px}.brand span{display:block;font-size:12px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px -14px rgba(16,24,40,.25);padding:16px;margin-bottom:14px}
h2{font-size:16px;margin:0}
label{display:block;font-size:13px;font-weight:600;color:#33465b;margin:10px 0 5px}
input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;outline:none;background:#fff}
input:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l)}
.btn{border:none;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:700;color:#fff;background:var(--teal);cursor:pointer}
.btn:hover{background:var(--teal-d)}
.btn.full{width:100%;margin-top:14px}.btn.alt{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.btn.gray{background:#64748b}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.gold{background:var(--gold);color:#23180a}
.btn.sm{padding:7px 11px;font-size:13px}.btn.ghost{background:transparent;color:var(--muted);border:none}
.row{display:flex;gap:10px;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{padding:10px 12px;border-radius:10px;font-size:13.5px;margin-top:12px;display:none}
.msg.show{display:block}.msg.ok{background:var(--green-l);color:#0f7a3d}.msg.err{background:var(--red-l);color:#b02a2a}.msg.info{background:#e6edf9;color:#264d97}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
.pill.g{background:var(--teal-l);color:var(--teal-d)}.pill.o{background:var(--gold-l);color:#8a6218}.pill.green{background:var(--green-l);color:#0f7a3d}.pill.red{background:var(--red-l);color:#b02a2a}.pill.gray{background:#eef1f4;color:#5a6b7d}
/* APP SHELL */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.sidebar{background:var(--teal-d);color:#dbe9e8;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.sbrand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.sbrand .logo{width:36px;height:36px;font-size:19px}.sbrand b{color:#fff;font-size:15px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#cfe3e2;text-decoration:none;font-weight:600;font-size:14px;cursor:pointer;margin-bottom:2px}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:#fff;color:var(--teal-d)}
.nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#8fb5b3;padding:12px 12px 4px}
.main{min-width:0}
.topbar{display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:20}
.hamb{display:none;background:none;border:none;font-size:22px;cursor:pointer}
.topbar h1{font-size:18px;margin:0;flex:1}
.topbar .sub{font-size:12px;color:var(--muted);font-weight:400}
.content{max-width:900px;margin:0 auto;padding:18px 16px 70px}
.status{font-size:12px;color:var(--muted)}
.dotlive{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:middle}
.dotlive.off{background:#cbd5e1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}.kpi .v{font-size:20px;font-weight:800;margin-top:4px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.item .nm{font-weight:700}.item .sb{font-size:12.5px;color:var(--muted);margin-top:2px}
.item .act{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.item .act .btn{flex:1;justify-content:center;text-align:center}
.mv{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.mv:last-child{border-bottom:none}.mv .sp{flex:1}.mv .nm{font-weight:600}.mv .sb{font-size:12px;color:var(--muted)}
.bal{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}.bal:last-child{border-bottom:none}
.searchbar{margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:9px 12px;border-radius:10px;background:#fff;border:1px solid var(--line);font-weight:700;color:var(--muted);cursor:pointer;font-size:13px}
.tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.calc{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px}.calc div{display:flex;justify-content:space-between;padding:3px 0}
.overlay{position:fixed;inset:0;background:rgba(15,23,32,.5);display:none;align-items:flex-start;justify-content:center;padding:30px 14px;z-index:60;overflow:auto}.overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:480px;padding:18px}.mhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.closex{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;font-size:13.5px;opacity:0;transition:.2s;z-index:99}.toast.show{opacity:1}
.backdrop{display:none}
@media print{
  .sidebar,.topbar,.no-print{display:none!important}
  .app{display:block}.content{max-width:none;padding:0}
  .card{box-shadow:none;border:1px solid #ccc}
  .print-table th,.print-table td{padding:4px 6px}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  img{display:inline-block!important}
  .jc-table{font-size:13px}
  .jc-table th,.jc-table td{padding:7px 8px}
  .jc-sheet{page-break-inside:auto}
  .jc-table tr{page-break-inside:avoid}
  .jc-sign{margin-top:24px}
}
.jc-scroll{overflow-x:auto}
.jc-table{width:100%;border-collapse:collapse;font-size:14px}
.jc-table th{text-align:left;border-bottom:2px solid var(--ink);padding:8px 8px;font-size:12.5px;color:#33465b}
.jc-table td{border-bottom:1px solid var(--line);padding:9px 8px}
.jc-table .jc-name{font-weight:700;font-size:14.5px}
.jc-table .jc-total td{font-weight:800;border-top:2px solid var(--ink);border-bottom:none}
.jc-sign{margin-top:16px;font-size:13px;color:#33465b}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.phead h2{margin:0}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;z-index:70;transform:translateX(-100%);transition:.2s;height:100vh}
  .sidebar.open{transform:none}
  .hamb{display:inline-flex}
  .kpis{grid-template-columns:repeat(2,1fr)!important}
  .two{grid-template-columns:1fr}
  .backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:65}
  .item .act{flex-direction:column}
  .item .act .btn{width:100%}
  .searchbar .row{flex-wrap:wrap}
  .searchbar .row input[type=text]{flex:1 1 100%}
  input,select,.btn{font-size:16px}
  .jc-scroll{-webkit-overflow-scrolling:touch}
}
@media(max-width:480px){
  .content{padding:12px}
  .card{padding:14px}
  .kpi{padding:10px}
  .kpi .v{font-size:15px}
  .kpi .l{font-size:11px}
  .btn{padding:12px 12px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="brand" style="flex-direction:column;gap:6px"><img id="brandLogo" alt="AFRIKAPITAL" style="max-width:280px;width:80%;height:auto"><span style="font-size:12px;color:var(--muted)">Investissements & solutions de crédit</span><span id="verLogin" style="font-size:11px;color:var(--muted)"></span></div>
  <div class="card">
    <h2>Connexion</h2>
    <label>E-mail</label><input type="email" id="email" placeholder="ex. abdoulaye@afrikapital.com" autocomplete="username">
    <label>Mot de passe</label><input type="password" id="pass" autocomplete="current-password">
    <div class="row" style="margin-top:14px"><button class="btn" style="flex:1" onclick="doLogin()">Se connecter</button><button class="btn alt" style="flex:1" onclick="doSignup()">Créer un compte</button></div>
    <div class="msg" id="authMsg"></div>
    <p class="status" style="margin-top:12px">Première connexion : e-mail + mot de passe puis « Créer un compte ».</p>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" style="display:none">
  <div class="backdrop" id="backdrop" onclick="closeMenu()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sbrand" style="display:block;text-align:center;padding:6px 4px"><img id="sideLogo" alt="AFRIKAPITAL" style="width:100%;max-width:170px;height:auto"><div id="verSide" style="font-size:10px;color:var(--muted);margin-top:2px"></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="hamb" onclick="toggleMenu()">☰</button>
      <div style="flex:1"><h1 id="pageTitle">Tableau de bord</h1><div class="sub" id="pageSub"></div></div>
      <div class="status" style="text-align:right"><span class="dotlive" id="liveDot"></span><span id="liveTxt">…</span><br><span id="meLine"></span></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- MODALS -->
<div class="overlay" id="ovCli"><div class="modal">
  <div class="mhd"><h2 id="cliTitle">Nouveau client</h2><button class="closex" onclick="close_('ovCli')">×</button></div>
  <input type="hidden" id="cId"><label>Nom complet *</label><input type="text" id="cName"><label>Téléphone</label><input type="tel" id="cPhone"><label>Activité</label><input type="text" id="cAct">
  <div class="msg" id="cMsg"></div>
  <div class="two" style="margin-top:14px"><button class="btn alt" id="cLoanBtn" onclick="openLoanFor()">+ Prêt</button><button class="btn" onclick="saveCli()">Enregistrer</button></div>
</div></div>

<div class="overlay" id="ovLoan"><div class="modal">
  <div class="mhd"><h2 id="loanTitle">Nouveau prêt</h2><button class="closex" onclick="close_('ovLoan')">×</button></div>
  <input type="hidden" id="lLoanId">
  <label>Client</label><select id="lClient"></select>
  <div class="two"><div><label>Capital *</label><input type="number" id="lCap" oninput="calcLoan()"></div><div><label>Date début</label><input type="date" id="lStart" oninput="calcLoan()"></div></div>
  <div class="two"><div><label>Durée (auto)</label><input type="number" id="lDur" value="50" readonly style="background:#f0f0f0"></div><div><label>Journalier *</label><input type="number" id="lDaily" oninput="calcLoan()"></div></div>
  <div class="calc"><div><span>Total dû (capital +10%)</span><b id="cTotal">—</b></div><div><span>Intérêts (10%)</span><b id="cInt" style="color:var(--gold)">—</b></div><div><span>Échéance</span><b id="cEnd">—</b></div><div><span>Solde final à l'échéance</span><b id="cSolde" style="color:var(--red)">—</b></div></div>
  <div class="msg" id="lMsg"></div><button class="btn full" id="loanBtn" onclick="saveLoan()">Accorder le crédit</button>
</div></div>

<div class="overlay" id="ovSav"><div class="modal">
  <div class="mhd"><h2 id="savTitle">Dépôt</h2><button class="closex" onclick="close_('ovSav')">×</button></div>
  <input type="hidden" id="sPlan"><input type="hidden" id="sType"><div class="status" id="savCat" style="margin-bottom:6px"></div>
  <label>Client</label><select id="sClient" onchange="savHint()"></select><label>Montant</label><input type="number" id="sAmt"><label>Date</label><input type="date" id="sDate">
  <div class="status" id="savHint" style="margin-top:6px"></div><div class="msg" id="sMsg"></div><button class="btn full" onclick="saveSaving()">Enregistrer</button>
</div></div>

<div class="overlay" id="ovSaver"><div class="modal">
  <div class="mhd"><h2 id="saverTitle">Nouvel épargnant</h2><button class="closex" onclick="close_('ovSaver')">×</button></div>
  <input type="hidden" id="svPlan">
  <label>Client existant</label><select id="svClient"></select>
  <label>Ou nouveau nom</label><input type="text" id="svNew" placeholder="Nom de l'épargnant">
  <label>Montant journalier d'épargne</label><input type="number" id="svDaily" placeholder="ex. 500">
  <div class="msg" id="svMsg"></div>
  <button class="btn full" onclick="saveSaver()">Enregistrer l'épargnant</button>
</div></div>

<div class="overlay" id="ovExp"><div class="modal">
  <div class="mhd"><h2>Nouvelle dépense</h2><button class="closex" onclick="close_('ovExp')">×</button></div>
  <label>Libellé *</label><input type="text" id="eLabel"><label>Catégorie</label><select id="eCat"><option value="courante">Dépense courante</option><option value="investissement">Investissement / achat de matériel</option></select><div class="two"><div><label>Montant *</label><input type="number" id="eAmt"></div><div><label>Date</label><input type="date" id="eDate"></div></div>
  <div class="msg" id="eMsg"></div><button class="btn full" onclick="saveExpense()">Enregistrer</button>
</div></div>

<div class="toast" id="toast"></div>

  LOANS.forEach(l=>((l.data.payments)||[]).forEach(p=>{if((p.collectedOn||p.date)===t)ops.push({k:"L|"+l.id+"|"+p.date+"|"+p.amount+"|"+(p.by||"")+"|"+(p.kind||""),by:p.by,txt:money(p.amount)+" — prêt "+clientName(l.data.clientId)});}));
  SAV.forEach(s=>{if(s.data.date===t&&s.data.type!=="retrait")ops.push({k:"S|"+s.id,by:s.data.by,txt:money(s.data.amount)+" — épargne "+clientName(s.data.clientId)});});
  EXP.forEach(e=>{if(e.data.date===t)ops.push({k:"E|"+e.id,by:e.data.by,txt:money(e.data.amount)+" — dépense"});});
  return ops;
}
function notify(msg){
  toast("🔔 "+msg);
  try{ if(typeof Notification!=="undefined"&&Notification.permission==="granted"){ new Notification("AFRIKAPITAL",{body:msg,icon:"icon.png",tag:"afk-"+Date.now()}); } }catch(e){}
}
function checkNewActivity(){
  if(!ME||!canEdit())return; // seul le gérant est notifié des opérations des collectrices
  const ops=activityList();
  if(_seenOps===null){_seenOps=new Set(ops.map(o=>o.k));return;} // 1er chargement : pas de notif
  const me=ME.email;
  const fresh=ops.filter(o=>!_seenOps.has(o.k)&&o.by&&o.by!==me&&o.by!=="import");
  fresh.forEach(o=>notify(String(o.by).split("@")[0]+" : "+o.txt));
  ops.forEach(o=>_seenOps.add(o.k));
}
function enableNotifs(){
  if(typeof Notification==="undefined"){toast("Notifications non supportées ici");return;}
  Notification.requestPermission().then(p=>{ if(p==="granted"){toast("Notifications activées");new Notification("AFRIKAPITAL",{body:"Notifications activées ✓",icon:"icon.png"});} else {toast("Notifications refusées");} if(VIEW==="dashboard")render(); });
}
function esc(s){return String(s==null?"":s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));}
function canEdit(){return ROLE==="gerant";}
function money(n){return (Math.round(Number(n)||0)).toLocaleString("fr-FR").replace(/\u202f/g," ");}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function addDays(iso,n){const d=parseISO(iso);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function diffDays(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000);}
function fmtDate(iso){if(!iso)return "—";return parseISO(iso).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"});}
function clientName(id){const c=CLIENTS.find(x=>x.id===id);return c?c.name:"—";}
function initials(n){return (n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();}
function savingsOf(clientId,plan){return SAV.filter(s=>s.data.clientId===clientId&&(!plan||(s.data.plan||"express")===plan)).reduce((b,s)=>b+((s.data.type==="retrait")?-1:1)*(+s.data.amount||0),0);}
function savedDaysOf(clientId,plan){const c=CLIENTS.find(x=>x.id===clientId);if(!c)return 0;const k=planCfgKey(plan);const daily=+((c[k]||{}).daily)||0;if(daily<=0)return 0;return Math.round(savingsOf(clientId,plan)/daily);}
function savExpectedDays(clientId,plan){const c=CLIENTS.find(x=>x.id===clientId);if(!c)return 0;const k=planCfgKey(plan);const since=(c[k]||{}).since;if(!since)return 0;const t=bizDay();if(t<=since)return 0;return Math.max(0,diffDays(since,t)-holidaysInRange(since,addDays(t,-1)));}
function savArrears(clientId,plan){return Math.max(0,savExpectedDays(clientId,plan)-savedDaysOf(clientId,plan));}
function loanStats(l){
  const d=l.data||{};const daily=+d.daily||0,cap=+d.capital||0,dur=+d.duration||DUR,start=d.startDate;const t=bizDay();
  const total=+d.total||Math.round(cap*(1+RATE/100)); // total dû = capital + 10%
  const pays=d.payments||[];
  const paid=pays.reduce((s,p)=>s+(+p.amount||0),0);
  const balance=Math.max(0,total-paid);
  const installmentsPaid=pays.filter(p=>p.kind!=="solde").length; // total versements (hors solde final) — pour affichage X/durée
  // Couverture des jours PASSÉS uniquement : versements journaliers de jours passés + rattrapages de retard.
  // Le versement du jour (kind 'jour' daté d'aujourd'hui) ne compte PAS ici → il ne réduit pas les retards.
  const coveredPast=pays.filter(p=>{if(p.kind==="solde")return false;if(p.kind==="retard")return true;return p.date<t;}).length;
  let dueYesterday=0; if(t>start){const rawDue=diffDays(start,t)-holidaysInRange(start,addDays(t,-1));dueYesterday=Math.min(dur,Math.max(0,rawDue));} dueYesterday=Math.max(0,dueYesterday); // 1er versement LE JOUR DE DÉBUT ; les jours fériés ne comptent pas comme dus
  const arrearsDays=Math.max(0,dueYesterday-coveredPast);
  const arrears=arrearsDays*daily;
  let elapsed=0;if(t>=start)elapsed=Math.min(dur,diffDays(start,t)+1);elapsed=Math.max(0,elapsed); // jour 1 = jour de début
  const end=addDays(start,dur-1); // échéance théorique (sans fériés)
  // Échéance RÉELLE : date du dur-ième jour de collecte, en sautant les jours fériés
  let endReal=start,cnt=0,g2=0;while(cnt<dur&&g2<3000){if(!isHoliday(endReal))cnt++;if(cnt>=dur)break;endReal=addDays(endReal,1);g2++;}
  const instRem=Math.max(0,Math.ceil(balance/(daily||1))); // versements restants (inclut les retards)
  // jours fériés à venir entre aujourd'hui et l'échéance réelle
  const holAhead=(t<endReal)?holidaysInRange(t,endReal):0;
  const joursRestants=instRem+holAhead; // jours restants réels (versements + fériés à venir)
  const settled=d.status==="solde"||balance<=0;
  const status=settled?"solde":(arrearsDays>0?"retard":"actif");
  const paidToday=pays.some(p=>p.date===t&&p.kind!=="retard"&&p.kind!=="solde");
  return {daily,total,cap,dur,start,paid,balance,elapsed,arrears,arrearsDays,end,endReal,instRem,joursRestants,status,settled,installmentsPaid,todayCount:paidToday?1:0,paidToday};
}

async function enterApp(){
  const {data:{user}}=await sb.auth.getUser();if(!user)return;ME=user;
  ROLE=MANAGERS.includes(user.email)?"gerant":"collectrice";
  try{const {data:p}=await sb.from("profiles").select("role").eq("id",user.id).single();if(p&&p.role==="gerant")ROLE="gerant";}catch(e){}
  $("login").style.display="none";$("app").style.display="";
  $("meLine").textContent=user.email.split("@")[0]+" · "+(ROLE==="gerant"?"Gérant":"Collectrice");
  buildNav();await loadAll();subscribe();go("dashboard");
}
function buildNav(){
  $("nav").innerHTML=NAV.map(n=>{
    if(n.sep)return `<div class="sep">${n.sep}</div>`;
    if(!n.roles.includes(ROLE))return "";
    return `<a data-v="${n.v}" onclick="go('${n.v}')">${n.ic} <span>${n.label}</span></a>`;
  }).join("");
}
function go(v){
  if(v==="logout"){doLogout();return;}
  VIEW=v;const def=VIEWS[v];if(!def)return;
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));
  $("pageTitle").textContent=def.title;$("pageSub").textContent=def.sub;
  def.render($("content"));closeMenu();
}

async function fetchAll(table){
  // Supabase limite chaque lecture à ~1000 lignes : on lit par paquets jusqu'à tout avoir.
  let all=[],from=0;const size=1000;
  for(let guard=0;guard<200;guard++){
    const {data,error}=await sb.from(table).select("id,data").range(from,from+size-1);
    if(error)return {data:all,error};
    const batch=data||[];all=all.concat(batch);
    if(batch.length<size)break;
    from+=size;
  }
  return {data:all,error:null};
}
async function loadAll(){
  const [c,l,s,e,cb]=await Promise.all([
    fetchAll("clients"),fetchAll("loans"),
    fetchAll("savings"),fetchAll("expenses"),fetchAll("cashbook")
  ]);
  if(c.error||l.error||s.error||e.error||cb.error){toast("Lecture impossible");console.error(c.error||l.error||s.error||e.error||cb.error);return;}
  CLIENTS=(c.data||[]).map(r=>({id:r.id,...(r.data||{})}));
  const _allLoans=(l.data||[]).map(r=>({id:r.id,data:r.data||{}}));
  LOANS=_allLoans.filter(x=>!x.data.deleted);
  TRASH=_allLoans.filter(x=>x.data.deleted);
  try{if(ME&&canEdit())TRASH.forEach(x=>{if(x.data.deletedAt&&diffDays(x.data.deletedAt,todayISO())>=7){sb.from("loans").delete().eq("id",x.id);}});}catch(e){}
  SAV=(s.data||[]).map(r=>({id:r.id,data:r.data||{}}));
  EXP=(e.data||[]).map(r=>({id:r.id,data:r.data||{}}));
  CASH=(cb.data||[]).map(r=>({id:r.id,data:r.data||{}}));
  BANK=CASH.filter(r=>r.data.kind==="bank");
  HOLIDAYS=CASH.filter(r=>r.data.kind==="ferie").map(r=>r.data.date).filter(Boolean);
  if(VIEW&&VIEWS[VIEW])VIEWS[VIEW].render($("content"));
  try{checkNewActivity();}catch(e){}
}

function renderDashboard(el){
  const t=bizDay();
  const active=LOANS.map(loanStats).filter(s=>s.status!=="solde");
  const encours=active.reduce((x,s)=>x+s.balance,0);
  const retards=active.filter(s=>s.status==="retard");
  const arrAmt=retards.reduce((a,s)=>a+s.arrears,0);
  const colRows=LOANS.map(l=>({l,s:loanStats(l)})).filter(r=>r.s.status!=="solde"&&t>=r.s.start&&!(r.l.data.payments||[]).some(p=>p.date===t&&p.avance));
  const colDone=colRows.filter(r=>r.s.paidToday).length;
  const colRemain=colRows.filter(r=>!r.s.paidToday);
  const colRemainAmt=colRemain.reduce((a,r)=>a+Math.min(r.s.daily,r.s.balance),0);
  let attenduPrets=0,collectePrets=0;
  colRows.forEach(r=>{const todayPay=((r.l.data.payments)||[]).filter(p=>p.date===t&&p.kind==="jour").reduce((x,p)=>x+(+p.amount||0),0);const avant=r.s.balance+todayPay;attenduPrets+=Math.min(r.s.daily,avant);collectePrets+=todayPay;});
  const restePrets=Math.max(0,attenduPrets-collectePrets);
  const svE=savers("express"),svK=savers("koor");const svTot=svE.length+svK.length;
  const svDone=svE.filter(c=>collectedToday(c.id,"express")).length+svK.filter(c=>collectedToday(c.id,"koor")).length;
  const finishing=active.filter(s=>s.balance>0&&Math.ceil(s.balance/(s.daily||1))<=1).length;
  const cash=closeFor(t);const cashVal=(cash===null?null:cash);
  const epE=SAV.filter(s=>(s.data.plan||"express")==="express").reduce((a,s)=>a+((s.data.type==="retrait")?-1:1)*(+s.data.amount||0),0);
  const epK=SAV.filter(s=>(s.data.plan||"express")==="koor").reduce((a,s)=>a+((s.data.type==="retrait")?-1:1)*(+s.data.amount||0),0);
  const F=(typeof projectWithRenewals==="function")?projectWithRenewals(30,0):{minT:0,minD:t};

  SAV.forEach(s=>{if(s.data.date===t&&s.data.by===meMail&&s.data.type!=="retrait")mySav+=+s.data.amount||0;});

async function pay(loanId){const l=LOANS.find(x=>x.id===loanId);if(!l)return;const s=loanStats(l);const t=bizDay();if(s.paidToday){toast("Déjà payé aujourd'hui");return;}if(s.balance<=0){toast("Prêt déjà soldé");return;}const amount=Math.min(s.daily,s.balance);const snap=JSON.stringify(l.data);const d=l.data;d.payments=d.payments||[];d.payments.push({date:t,amount,by:ME.email,kind:"jour",ts:Date.now()});await pushLoan(l,"Versement du jour enregistré",snap);}
async function advancePay(loanId){
  if(!canEdit()){toast("Réservé au gérant");return;}
  const l=LOANS.find(x=>x.id===loanId);if(!l)return;const s=loanStats(l);
  if(s.balance<=0){toast("Prêt déjà soldé");return;}
  const maxDays=Math.max(1,Math.ceil(s.balance/(s.daily||1)));
  const v=prompt("Combien de jours payer à l'avance ? (max "+maxDays+")","");
  if(v===null)return;let n=parseInt(v,10);if(!(n>0)){toast("Nombre invalide");return;}
  n=Math.min(n,maxDays);
  const t=bizDay();const snap=JSON.stringify(l.data);const d=l.data;d.payments=d.payments||[];
  const paidDates=new Set(d.payments.filter(p=>p.kind!=="solde").map(p=>p.date));
  const days=[];let day=t,g=0;
  while(days.length<n&&g<3000){if(!isHoliday(day)&&!paidDates.has(day))days.push(day);day=addDays(day,1);g++;}
  let remaining=s.balance,done=0;
  for(const dd of days){if(remaining<=0)break;const amt=Math.min(s.daily,remaining);d.payments.push({date:dd,amount:amt,kind:"jour",avance:true,collectedOn:t,by:ME.email,ts:Date.now()});remaining-=amt;done++;}
  if(done===0){toast("Rien à avancer");return;}
  await pushLoan(l,done+" jour(s) payé(s) à l'avance",snap);
}
async function payLoanArrear(loanId){
  const l=LOANS.find(x=>x.id===loanId);if(!l)return;
  const s=loanStats(l);
  if(s.balance<=0){toast("Prêt déjà soldé");return;}
  if(s.arrearsDays<=0){toast("Aucun retard");return;}
  const v=prompt("Combien de jours de retard payer ? (retard actuel : "+s.arrearsDays+")",String(s.arrearsDays));
  if(v===null)return;let n=parseInt(v,10);if(!(n>0)){toast("Nombre invalide");return;}
  n=Math.min(n,s.arrearsDays);
  const t=bizDay();const d=l.data;d.payments=d.payments||[];
  const paidDates=new Set(d.payments.filter(p=>p.kind!=="solde").map(p=>p.date));
  const unpaid=[];let day=s.start,g=0;
  while(day<t&&g<3000){if(!isHoliday(day)&&!paidDates.has(day))unpaid.push(day);day=addDays(day,1);g++;}
  const toPay=unpaid.slice(0,n);
  let remaining=s.balance,done=0;const snap=JSON.stringify(d);
  for(const dd of toPay){if(remaining<=0)break;const amt=Math.min(s.daily,remaining);d.payments.push({date:dd,amount:amt,by:ME.email,kind:"jour",ts:Date.now()});remaining-=amt;done++;}
  if(done===0){toast("Aucun retard à payer");return;}
  await pushLoan(l,done+" jour(s) de retard payé(s)"+(done<n?" (plafonné au solde)":""),snap);
}
async function paySavArrear(clientId,plan){
  const c=CLIENTS.find(x=>x.id===clientId);if(!c)return;const k=planCfgKey(plan);const daily=+((c[k]||{}).daily)||0;if(daily<=0){toast("Montant journalier non défini");return;}
  const ar=savArrears(clientId,plan);
  if(ar<=0){toast("Aucun retard");return;}
  const v=prompt("Combien de jours de retard d'épargne payer ? (retard actuel : "+ar+")",String(ar));
  if(v===null)return;let n=parseInt(v,10);if(!(n>0)){toast("Nombre invalide");return;}
  n=Math.min(n,ar);
  const {ok,error}=await withRetry(()=>sb.from("savings").insert({data:{clientId,type:"depot",plan,amount:n*daily,date:bizDay(),kind:"retard",note:n+" jour(s) de retard",by:ME.email,ts:Date.now()}}));
  if(!ok){toast("⚠️ Non enregistré : "+savErr(error));showSaveError(error);return;}
  toast(n+" jour(s) de retard épargne payé(s)");loadAll();
}
async function collectSavToday(clientId,plan){

  const t=bizDay();
  if(SAV.some(s=>s.data.clientId===clientId&&(s.data.plan||"express")===plan&&s.data.date===t&&s.data.type!=="retrait"&&s.data.kind!=="retard")){toast("Déjà collecté aujourd'hui");return;}
  const row={clientId,type:"depot",plan,amount:daily,date:t,kind:"jour",by:ME.email,ts:Date.now()};

}

function dayCollecte(date){let s=0;LOANS.forEach(l=>((l.data.payments)||[]).forEach(p=>{if((p.collectedOn||p.date)===date)s+=+p.amount||0;}));return s;}
function dayDepots(date){return SAV.filter(s=>s.data.type!=="retrait"&&s.data.date===date).reduce((a,s)=>a+(+s.data.amount||0),0);}
function dayRetraits(date){return SAV.filter(s=>s.data.type==="retrait"&&s.data.date===date).reduce((a,s)=>a+(+s.data.amount||0),0);}
function dayDepenses(date){return EXP.filter(e=>e.data.date===date).reduce((a,e)=>a+(+e.data.amount||0),0);}
function dayBank(date){return BANK.filter(b=>b.data.date===date).reduce((a,b)=>a+((b.data.type==="depot")?-1:1)*(+b.data.amount||0),0);} // transfert vers banque = sortie de caisse
function dayInject(date){return CASH.filter(c=>c.data.kind==="inject"&&c.data.date===date).reduce((a,c)=>a+(+c.data.amount||0),0);}
function dayDisbursed(date){return LOANS.filter(l=>(l.data.disbursedDate||l.data.startDate)===date).reduce((a,l)=>a+(+l.data.capital||0),0);}
function netDay(date){return dayCollecte(date)+dayDepots(date)+dayInject(date)-dayRetraits(date)-dayDepenses(date)+dayBank(date)-dayDisbursed(date);}

function netBetween(from,toExcl){let s=0;LOANS.forEach(l=>{(l.data.payments||[]).forEach(p=>{const pd=p.collectedOn||p.date;if(pd>=from&&pd<toExcl)s+=+p.amount||0;});const dd=(l.data.disbursedDate||l.data.startDate);if(dd>=from&&dd<toExcl)s-=+l.data.capital||0;});SAV.forEach(x=>{if(x.data.date>=from&&x.data.date<toExcl)s+=((x.data.type==="retrait")?-1:1)*(+x.data.amount||0);});EXP.forEach(e=>{if(e.data.date>=from&&e.data.date<toExcl)s-=+e.data.amount||0;});CASH.forEach(c=>{if(c.data.kind==="inject"&&c.data.date>=from&&c.data.date<toExcl)s+=+c.data.amount||0;});BANK.forEach(b=>{if(b.data.date>=from&&b.data.date<toExcl)s+=((b.data.type==="depot")?-1:1)*(+b.data.amount||0);});return s;}
function openingFor(date){const b=cashBase();if(!b)return null;if(date<=b.data.date)return +b.data.opening||0;return (+b.data.opening||0)+netBetween(b.data.date,date);}
function closeFor(date){const o=openingFor(date);if(o===null)return null;return o+netDay(date);}

/* ---------- JOURNAL DES RETARDS ---------- */
function scoreClient(clientId){
  const loans=LOANS.filter(l=>l.data.clientId===clientId).map(l=>({l,s:loanStats(l)}));
  if(!loans.length)return null;
  const totalFinance=loans.reduce((a,x)=>a+(+x.l.data.capital||0),0);
  const active=loans.filter(x=>x.s.status!=="solde");
  const encours=active.reduce((a,x)=>a+x.s.balance,0);
  const nbCredits=loans.length;
  let nbRemb=0,latePay=0,arrearPay=0,caGenere=0,marge=0;
  loans.forEach(x=>{const total=+x.l.data.total||1;const cap=+x.l.data.capital||0;const interet=total-cap;
    (x.l.data.payments||[]).forEach(p=>{nbRemb++;const amt=+p.amount||0;caGenere+=amt;marge+=amt*(interet/total);
      if(p.kind==="retard")arrearPay++;
      if(p.ts){const hh=new Date(p.ts).getHours();if(hh>=23||hh<5)latePay++;}
    });
  });
  const joursRetard=active.reduce((a,x)=>a+(x.s.arrearsDays||0),0);
  const coutRisque=active.reduce((a,x)=>a+(x.s.arrears||0),0);
  const retards=arrearPay+latePay;
  const starts=loans.map(x=>x.l.data.startDate).filter(Boolean).sort();
  const anciennete=starts.length?Math.max(0,diffDays(starts[0],bizDay())):0;
  const plafondActuel=loans.reduce((a,x)=>Math.max(a,+x.l.data.capital||0),0);
  let score=100;
  score-=joursRetard*3;
  score-=latePay*2;
  score-=arrearPay*1;
  if(totalFinance>0&&coutRisque>0)score-=Math.min(20,Math.round(coutRisque/totalFinance*100));
  score+=Math.min(12,Math.floor(anciennete/30));
  score=Math.max(0,Math.min(100,Math.round(score)));
  let cat,color,factor;
  if(joursRetard===0){cat="Premium";color="#1f9d55";factor=1.5;}
  else if(joursRetard<=3){cat="Fiable";color="#2b6cb0";factor=1.25;}
  else if(joursRetard<=5){cat="À surveiller";color="#b7791f";factor=1;}
  else{cat="Risque élevé";color="#c53030";factor=0.5;}
  const plafondReco=Math.max(0,Math.round(plafondActuel*factor/5000)*5000);
  const epargne=savingsOf(clientId,"express")+savingsOf(clientId,"koor")+savingsOf(clientId,"classique");
  const lateRatio=nbRemb>0?latePay/nbRemb:0;
  let payer;
  if(joursRetard===0&&latePay===0)payer="Bon payeur";
  else if(joursRetard>5||lateRatio>0.3)payer="Mauvais payeur";
  else payer="Payeur moyen";
  const eligibleSav=(payer==="Bon payeur"&&anciennete>=90&&epargne>0&&joursRetard===0);
  const savCeiling=eligibleSav?Math.round(epargne*3/5000)*5000:0;
  return {clientId,totalFinance,encours,nbCredits,nbRemb,retards,joursRetard,caGenere,marge:Math.round(marge),coutRisque,anciennete,plafondActuel,plafondReco,score,cat,color,latePay,lateRatio,epargne,payer,eligibleSav,savCeiling};
}
function clientRisk(sc){
  const ead=Math.max(0,sc.encours);
  let pd=0.03;
  pd+=Math.min(0.55,sc.joursRetard*0.05);
  if(sc.nbRemb>0)pd+=Math.min(0.2,(sc.latePay/sc.nbRemb)*0.5);
  if(sc.cat==="Risque élevé")pd+=0.20;else if(sc.cat==="À surveiller")pd+=0.08;
  if(sc.anciennete<30)pd+=0.05;
  pd=Math.max(0.01,Math.min(0.95,pd));
  const lgd=0.5;
  const el=Math.round(pd*lgd*ead);
  const profitRem=Math.round(ead*(0.10/1.10));
  const rar=ead>0?(profitRem-el)/ead:0;
  return {ead,pd,lgd,el,profitRem,rar};
}
function earlyWarning(sc){
  const signals=[];
  if(sc.joursRetard>=1&&sc.joursRetard<=3)signals.push("Retard naissant ("+sc.joursRetard+" j)");
  if(sc.joursRetard>3&&sc.joursRetard<=5)signals.push("Retard qui s'installe ("+sc.joursRetard+" j)");
  if(sc.latePay>0)signals.push(sc.latePay+" versement(s) tardif(s) après 23h");
  if(sc.lateRatio>0.2)signals.push("Paiements souvent tardifs ("+(sc.lateRatio*100).toFixed(0)+"%)");
  if(sc.risk&&sc.risk.pd>=0.25)signals.push("Probabilité de défaut élevée ("+(sc.risk.pd*100).toFixed(0)+"%)");
  if(sc.payer==="Mauvais payeur")signals.push("Profil : mauvais payeur");
  let level,color;
  if(sc.joursRetard>5){level="🔴 Alerte rouge";color="#c53030";}
  else if(signals.length>=2){level="🟠 Alerte orange";color="#dd6b20";}
  else if(signals.length===1){level="🟡 Vigilance";color="#b7791f";}
  else {level="🟢 RAS";color="#1f9d55";}
  return {level,color,signals};
}
function aladdinDecision(sc){
  const gap=Math.max(0,sc.plafondReco-sc.plafondActuel);const inArrears=sc.joursRetard>0;
  let credit;
  if(sc.cat==="Risque élevé")credit={verb:"Réduire / geler le plafond",target:sc.plafondReco,color:"#c53030",reason:"Historique à risque : limiter l'exposition."};
  else if(inArrears)credit={verb:"Maintenir — attendre régularisation",target:sc.plafondActuel,color:"#b7791f",reason:"Retard en cours : pas de hausse avant remise à jour."};
  else if(sc.cat==="Premium"&&gap>0)credit={verb:"Augmenter le plafond",target:sc.plafondReco,color:"#1f9d55",reason:"Excellent historique : hausse de "+money(gap)+" possible."};
  else if(sc.cat==="Fiable"&&gap>0)credit={verb:"Augmenter (prudent)",target:sc.plafondReco,color:"#2b6cb0",reason:"Bon historique : hausse modérée de "+money(gap)+"."};
  else credit={verb:"Maintenir le plafond",target:sc.plafondActuel,color:"#555",reason:"Situation stable."};
  credit.gap=gap;
  // Crédit garanti par l'épargne (jusqu'à 3× l'épargne bloquée) pour bons clients anciens
  credit.savBacked=sc.eligibleSav?{eligible:true,amount:sc.savCeiling,epargne:sc.epargne}:{eligible:false};
  if(sc.eligibleSav&&sc.savCeiling>Math.max(sc.plafondActuel,credit.target)){credit.target=Math.max(credit.target,sc.savCeiling);credit.reason+=" Éligible crédit garanti épargne : jusqu'à "+money(sc.savCeiling)+" (3× épargne, "+money(sc.epargne)+" bloqués).";}
  let rec;const jr=sc.joursRetard;
  if(jr<=0)rec={verb:"Aucune action",prio:0,color:"#1f9d55",reason:"Client à jour."};
  else if(jr<=2)rec={verb:"Rappel amical (WhatsApp)",prio:1,color:"#2b6cb0",reason:jr+" j de retard."};
  else if(jr<=5)rec={verb:"Relance rapprochée (appel + WhatsApp)",prio:2,color:"#b7791f",reason:jr+" j de retard."};
  else if(jr<=10)rec={verb:"Visite terrain",prio:3,color:"#dd6b20",reason:jr+" j de retard."};
  else rec={verb:"Recouvrement urgent / restructuration",prio:4,color:"#c53030",reason:jr+" j de retard."};
  rec.montant=sc.coutRisque;rec.weight=jr*((sc.coutRisque||0)+1);
  return {credit,recovery:rec};
}
function decisionAnalyze(clientId,proposed){
  const sc=scoreClient(clientId);
  if(!sc){return {sc:null,proposed,reco:0,ratio:0,riskPts:35,level:"Modéré",color:"#b7791f",verdict:"Accorder avec prudence",vcolor:"#b7791f",action:"Nouveau client sans historique : commence par un petit montant et observe son comportement de remboursement.",inArrears:false,isNew:true};}
  const reco=sc.plafondReco||sc.plafondActuel||proposed;
  const ratio=reco>0?proposed/reco:(proposed>0?9:0);
  const inArrears=sc.joursRetard>0;
  let riskPts=0;
  if(inArrears)riskPts+=40;
  if(sc.cat==="Risque élevé")riskPts+=40;else if(sc.cat==="À surveiller")riskPts+=20;else if(sc.cat==="Fiable")riskPts+=5;
  if(ratio>1.3)riskPts+=30;else if(ratio>1)riskPts+=15;
  if(sc.anciennete<30)riskPts+=15;else if(sc.anciennete<90)riskPts+=5;
  if(sc.latePay>0)riskPts+=Math.min(10,sc.latePay*3);
  riskPts=Math.max(0,Math.min(100,riskPts));
  let level,color,verdict,vcolor,action;
  if(riskPts<25){level="Faible";color="#1f9d55";verdict="Accorder";vcolor="#1f9d55";action="Le montant est cohérent avec le profil du client. Feu vert.";}
  else if(riskPts<55){level="Modéré";color="#b7791f";verdict="Accorder avec prudence";vcolor="#b7791f";action="Envisage un montant plafonné à "+money(reco)+" et un suivi rapproché.";}
  else{level="Élevé";color="#c53030";verdict="Refuser ou réduire";vcolor="#c53030";action=inArrears?"Régulariser d'abord les retards ("+sc.joursRetard+" j) avant tout nouveau crédit.":"Trop risqué pour ce montant. Limiter à "+money(reco)+" ou refuser.";}
  return {sc,proposed,reco,ratio,riskPts,level,color,verdict,vcolor,action,inArrears,isNew:false};
}

function portfolioRisk(){

function renderKPI(el){

  const capitalActif=active.reduce((a,r)=>a+(+r.l.data.capital||0),0);
  const interet=active.reduce((a,r)=>a+((+r.l.data.total||0)-(+r.l.data.capital||0)),0);
  const collected=LOANS.reduce((a,l)=>a+((l.data.payments||[]).reduce((x,p)=>x+(+p.amount||0),0)),0);
  const arrearsAmt=active.reduce((a,r)=>a+(r.s.arrears||0),0);
  const arrearsBal=active.filter(r=>r.s.arrearsDays>0).reduce((a,r)=>a+r.s.balance,0);
  const avgDur=active.length?Math.round(active.reduce((a,r)=>a+(+r.l.data.duration||50),0)/active.length):50;
  const caisse=closeFor(t)||0;
  const bank=BANK.reduce((a,b)=>a+((b.data.type==="depot")?1:-1)*(+b.data.amount||0),0);
  const epargne=CLIENTS.reduce((a,c)=>a+savingsOf(c.id,"express")+savingsOf(c.id,"koor")+savingsOf(c.id,"classique"),0);
  const recouvrement=(collected+arrearsAmt)>0?collected/(collected+arrearsAmt)*100:100;
  const tauxRetard=encours>0?arrearsBal/encours*100:0;
  const rendement=capitalActif>0?interet/capitalActif*100:0;
  const rendementAn=rendement*(360/avgDur);
  const rotation=avgDur>0?360/avgDur:0;
  const liquidite=epargne>0?(caisse+bank)/epargne:null;

  const card=(label,val,desc,color)=>`<div class="card"><div class="sb" style="text-transform:uppercase;letter-spacing:.5px">${label}</div><div style="font-size:24px;font-weight:800;color:${color||'var(--ink)'};margin:2px 0">${val}</div><div class="sb">${desc}</div></div>`;

  <div class="card"><img src="${LOGO}" alt="AFRIKAPITAL" style="height:40px;margin-bottom:8px"><div class="phead"><h2>KPI / Indicateurs</h2><div class="status">AFRIKAPITAL · ${fmtDate(t)}</div></div>
    <div class="status" style="margin-top:6px">Encours ${money(encours)} · Épargne détenue ${money(epargne)} · Caisse ${money(caisse)}${bank?" · Banque "+money(bank):""}</div>
  </div>
  ${card("Taux de recouvrement",recouvrement.toFixed(1)+" %","Sommes encaissées ÷ sommes dues à ce jour. Plus c'est haut, mieux c'est.",recouvrement>=90?'var(--green)':'var(--gold)')}
  ${card("Taux de retard (portefeuille à risque)",tauxRetard.toFixed(1)+" %","Encours des prêts en retard ÷ encours total. Plus c'est bas, mieux c'est.",tauxRetard<=10?'var(--green)':'var(--red)')}
  ${card("Rendement du portefeuille",rendement.toFixed(1)+" % par cycle","Intérêts ÷ capital prêté — soit environ "+rendementAn.toFixed(0)+" % par an (cycle moyen de "+avgDur+" jours).",'var(--teal)')}
  ${card("Rotation du capital",rotation.toFixed(1)+" fois / an","Combien de fois le capital est prêté puis remboursé dans l'année (360 ÷ durée moyenne).")}
  ${card("Ratio de liquidité",liquidite===null?"—":liquidite.toFixed(2),"(Caisse + Banque) ÷ Épargne détenue. ≥ 1 = l'épargne des clients est couverte par tes liquidités.",liquidite!==null&&liquidite>=1?'var(--green)':'var(--red)')}
  ${card("Fonds de roulement (FR)",money(FR)+" FCFA","(Caisse + Banque + Encours prêts) − Épargne détenue. Ce que tu possèdes net à court terme.",FR>=0?'var(--green)':'var(--red)')}

}

      dd=addDays(dd,1);guard++;
    }
    return `<div class="card"><div class="phead"><h2 style="font-size:15px">Prêt du ${fmtDate(s.start)}</h2><span class="pill ${s.status==="retard"?"red":(s.status==="solde"?"gray":"green")}">${s.status}</span></div>

      ${s.status!=="solde"?`<div class="bal"><span>Jours restants à verser</span><b style="color:var(--teal)">${s.instRem}${s.joursRestants>s.instRem?` (+${s.joursRestants-s.instRem} férié à venir → ${s.joursRestants} j)`:""}</b></div>`:""}
      <div class="bal"><span>Payé / Reste</span><b>${money(s.paid)} / ${money(s.balance)}</b></div>
      <div class="bal"><span>Retard</span><b style="color:${s.arrearsDays>0?'var(--red)':'var(--green)'}">${s.arrearsDays>0?s.arrearsDays+" j ("+money(s.arrears)+")":"aucun"}</b></div>
      <div style="margin-top:10px"><div class="sb" style="margin-bottom:6px">Calendrier (✓ payé · · non versé · F férié)${canEdit()?" — touchez un jour pour marquer payé / non payé":""}</div><div style="display:flex;flex-wrap:wrap;gap:5px">${cells||'<span class="sb">—</span>'}</div></div>
      ${s.status!=="solde"&&s.arrearsDays>0?`<button class="btn full no-print" style="margin-top:10px;background:var(--gold)" onclick="payLoanArrear('${l.id}')">➕ Payer un retard (${s.arrearsDays} j)</button>`:""}
      ${canEdit()&&s.status!=="solde"?`<button class="btn full no-print alt" style="margin-top:8px" onclick="advancePay('${l.id}')">⏩ Verser à l'avance (déplacement…)</button>`:""}
      ${canEdit()?`<div class="act no-print" style="margin-top:10px"><button class="btn alt" onclick="openEditLoan('${l.id}')">✏️ Modifier</button>${s.status!=="solde"?`<button class="btn gold" onclick="soldeLoan('${l.id}')">💰 Solder ce prêt (reste ${money(s.balance)})</button>`:`<button class="btn alt" onclick="reprendreLoan('${l.id}')">↩️ Annuler le solde (reprendre)</button>`}<button class="btn red" onclick="deleteLoan('${l.id}')">🗑️ Supprimer</button></div>`:""}
    </div>`;
  }).join(""):`<div class="empty">Aucun prêt pour ce client.</div>`}`;
}

async function addBank(type){
  if(!canEdit()){toast("Réservé au gérant");return;}
  const label=type==="depot"?"déposer en banque (sortie de caisse)":"retirer de la banque (entrée en caisse)";
  const v=prompt("Montant à "+label+" :","");if(v===null)return;const amount=+v||0;if(amount<=0){toast("Montant invalide");return;}
  const {ok}=await withRetry(()=>sb.from("cashbook").insert({data:{kind:"bank",type,amount,date:bizDay(),by:ME.email},updated_by:ME.id}));
  if(!ok){toast("⚠️ Non enregistré (réseau). Réessayez.");return;}
  toast(type==="depot"?"Dépôt en banque enregistré":"Retrait de banque enregistré");loadAll();
}
async function delBank(id){if(!canEdit())return;if(!confirm("Supprimer ce mouvement bancaire ?"))return;const {error}=await sb.from("cashbook").delete().eq("id",id);if(error){toast("Suppression impossible");return;}toast("Supprimé");loadAll();}

/* ---------- COMPTABILITE / TRESORERIE ---------- */
function epHeldTotal(plan){return SAV.filter(s=>(!plan||(s.data.plan||"express")===plan)).reduce((a,s)=>a+((s.data.type==="retrait")?-1:1)*(+s.data.amount||0),0);}
function bankBalance(){return BANK.reduce((a,b)=>a+((b.data.type==="depot")?1:-1)*(+b.data.amount||0),0);}
function renderCompta(el){
  const t=bizDay();
  const caisse=closeFor(t); const caisseVal=(caisse===null?0:caisse);
  const banque=bankBalance();
  const epE=epHeldTotal("express"),epK=epHeldTotal("koor"),epC=epHeldTotal("classique"),epAll=epE+epK+epC;
  const encours=LOANS.map(loanStats).filter(s=>s.status!=="solde").reduce((a,s)=>a+s.balance,0);
  const capitalDehors=LOANS.map(loanStats).filter(s=>s.status!=="solde").reduce((a,s)=>a+s.cap,0);
  // CA : intérêts encaissés = paiements reçus au-delà du capital, pour prêts soldés + intérêts déjà couverts
  const interetsEncaisses=LOANS.reduce((a,l)=>{const s=loanStats(l);const paidTot=s.paid;const interetsPart=Math.max(0,paidTot-s.cap);return a+Math.min(interetsPart,s.total-s.cap);},0);
  const depTot=EXP.reduce((a,e)=>a+(+e.data.amount||0),0);
  const invest=EXP.filter(e=>e.data.cat==="investissement").reduce((a,e)=>a+(+e.data.amount||0),0);
  const liquidites=caisseVal+banque;
  const tresoNette=liquidites-epAll; // ce qui t'appartient vraiment (hors épargne à rendre)
  const patrimoine=liquidites+encours-epAll; // + argent chez les clients à recouvrer
  el.innerHTML=`
  <div class="kpis"><div class="kpi"><div class="l">Caisse (espèces)</div><div class="v" style="font-size:16px">${money(caisseVal)}</div></div><div class="kpi"><div class="l">Banque</div><div class="v" style="font-size:16px">${money(banque)}</div></div><div class="kpi"><div class="l">Épargne à rendre</div><div class="v" style="font-size:16px;color:var(--red)">${money(epAll)}</div></div><div class="kpi"><div class="l">Encours crédits</div><div class="v" style="font-size:16px">${money(encours)}</div></div></div>
  <div class="card"><h2 style="margin-bottom:8px">Trésorerie</h2>
    <div class="bal"><span>Caisse (espèces)</span><b>${money(caisseVal)} FCFA</b></div>
    <div class="bal"><span>Banque</span><b>${money(banque)} FCFA</b></div>
    <div class="bal"><span><b>Liquidités totales</b></span><b>${money(liquidites)} FCFA</b></div>
    <div class="bal"><span>− Épargne clients à restituer</span><b style="color:var(--red)">${money(epAll)} FCFA</b></div>
    <div class="bal"><span><b>Trésorerie nette (à vous)</b></span><b style="color:var(--teal);font-size:16px">${money(tresoNette)} FCFA</b></div>
  </div>
  <div class="card"><h2 style="margin-bottom:8px">Détail épargne détenue</h2>
    <div class="bal"><span>⚡ Express</span><b>${money(epE)} FCFA</b></div>
    <div class="bal"><span>🌱 Koor</span><b>${money(epK)} FCFA</b></div>
    <div class="bal"><span>🏦 Classique</span><b>${money(epC)} FCFA</b></div>
  </div>
  <div class="card"><h2 style="margin-bottom:8px">Activité crédit</h2>
    <div class="bal"><span>Capital dehors (chez les clients)</span><b>${money(capitalDehors)} FCFA</b></div>
    <div class="bal"><span>Encours total à recouvrer</span><b>${money(encours)} FCFA</b></div>
    <div class="bal"><span>Intérêts encaissés (CA)</span><b style="color:var(--gold)">${money(interetsEncaisses)} FCFA</b></div>
  </div>
  <div class="card"><h2 style="margin-bottom:8px">Dépenses</h2>
    <div class="bal"><span>Total dépenses</span><b style="color:var(--red)">${money(depTot)} FCFA</b></div>
    <div class="bal"><span>Dont investissement / matériel</span><b>${money(invest)} FCFA</b></div>
  </div>
  <div class="card"><div class="bal"><span><b>Patrimoine estimé</b> (liquidités + à recouvrer − épargne)</span><b style="font-size:16px">${money(patrimoine)} FCFA</b></div></div>`;
}

/* ---------- ACTIVITE PAR COLLECTRICE ---------- */
let _actDate=null;
function userLabel(by){if(!by||by==="?")return "Inconnu";if(by==="import")return "Import";return String(by).split("@")[0];}
function activityByUser(date){
  const map={};const get=e=>(map[e]=map[e]||{loan:0,retard:0,solde:0,sav:0,retrait:0,dep:0,ops:0});
  LOANS.forEach(l=>(l.data.payments||[]).forEach(p=>{if(p.date===date){const u=get(p.by||"?");const a=+p.amount||0;if(p.kind==="solde")u.solde+=a;else if(p.kind==="retard")u.retard+=a;else u.loan+=a;u.ops++;}}));
  SAV.forEach(s=>{if(s.data.date===date){const u=get(s.data.by||"?");if(s.data.type==="retrait")u.retrait+=+s.data.amount||0;else u.sav+=+s.data.amount||0;u.ops++;}});
  EXP.forEach(e=>{if(e.data.date===date){const u=get(e.data.by||"?");u.dep+=+e.data.amount||0;u.ops++;}});
  return map;
}
function renderActivite(el){

/* ---------- JOURNEE : ENTREES / SORTIES ---------- */
let _mvDate=null;
function dayMovements(date){
  const mv=[];
  LOANS.forEach(l=>{
    (l.data.payments||[]).forEach(p=>{if(p.date===date){const cat=p.kind==="solde"?"Solde de prêt":(p.kind==="retard"?"Rattrapage prêt":"Versement prêt");mv.push({dir:"in",cat,who:clientName(l.data.clientId),amount:+p.amount||0});}});
    if((l.data.disbursedDate||l.data.startDate)===date){mv.push({dir:"out",cat:"Prêt accordé (capital)",who:clientName(l.data.clientId),amount:+l.data.capital||0});}
  });
  SAV.forEach(s=>{if(s.data.date===date){const isRet=s.data.type==="retrait";mv.push({dir:isRet?"out":"in",cat:(isRet?"Retrait épargne":"Dépôt épargne")+" "+((s.data.plan||"express")==="koor"?"Koor":"Express"),who:clientName(s.data.clientId),amount:+s.data.amount||0});}});
  EXP.forEach(e=>{if(e.data.date===date){mv.push({dir:"out",cat:"Dépense"+(e.data.cat==="investissement"?" (invest.)":""),who:e.data.label,amount:+e.data.amount||0});}});
  BANK.forEach(b=>{if(b.data.date===date){const dep=b.data.type==="depot";mv.push({dir:dep?"out":"in",cat:dep?"Dépôt en banque":"Retrait de banque",who:"Banque",amount:+b.data.amount||0});}});
  return mv;
}
function renderMouv(el){

  <div class="card"><h2 style="margin-bottom:8px;color:var(--green)">Entrées — ${money(totIn)}</h2>${ins.length?ins.map(m=>`<div class="mv"><div><div class="nm">${esc(m.who)}</div><div class="sb">${m.cat}</div></div><div class="sp"></div><b style="color:var(--green)">+${money(m.amount)}</b></div>`).join(""):`<div class="empty">Aucune entrée.</div>`}</div>

async function restoreBackup(ev){
  if(!canEdit()){toast("Réservé au gérant");return;}
  const file=ev.target.files&&ev.target.files[0];if(!file)return;
  let data;try{data=JSON.parse(await file.text());}catch(e){toast("Fichier illisible");ev.target.value="";return;}
  if(!data||data.app!=="AFRIKAPITAL"||!Array.isArray(data.clients)){toast("Ce n'est pas une sauvegarde AFRIKAPITAL");ev.target.value="";return;}
  const nc=(data.clients||[]).length,nl=(data.loans||[]).length,ns=(data.savings||[]).length;
  if(!confirm("Restaurer cette sauvegarde ?\n\n"+nc+" clients · "+nl+" prêts · "+ns+" mouvements d'épargne.\n\n⚠️ ATTENTION : cela REMPLACE toutes les données actuelles de l'application.")){ev.target.value="";return;}
  show("restoreMsg","",""); const set=m=>{const el=$("restoreMsg");if(el)el.innerHTML='<div class="status" style="margin-top:8px">'+m+'</div>';};
  set("Restauration en cours… ne fermez pas l'appli.");
  try{
    for(const [tbl,arr] of [["loans",LOANS],["savings",SAV],["expenses",EXP],["cashbook",CASH],["clients",CLIENTS]]){
      for(const row of arr){try{await sb.from(tbl).delete().eq("id",row.id);}catch(e){}}
    }
    let done=0,fail=0;
    for(const c of data.clients){const d={...c};delete d.id;const {error}=await sb.from("clients").insert({id:c.id,data:d,updated_by:ME.id});if(error)fail++;else done++;}
    for(const x of (data.loans||[])){const {error}=await sb.from("loans").insert({id:x.id,data:x.data,updated_by:ME.id});if(error)fail++;else done++;}
    for(const x of (data.savings||[])){const {error}=await sb.from("savings").insert({id:x.id,data:x.data,updated_by:ME.id});if(error)fail++;else done++;}
    for(const x of (data.expenses||[])){const {error}=await sb.from("expenses").insert({id:x.id,data:x.data,updated_by:ME.id});if(error)fail++;else done++;}
    for(const x of (data.cashbook||[])){const {error}=await sb.from("cashbook").insert({id:x.id,data:x.data,updated_by:ME.id});if(error)fail++;else done++;}
    set("✅ Restauration terminée : "+done+" éléments restaurés"+(fail?(" · "+fail+" échecs"):"")+".");
    toast("Restauration terminée");ev.target.value="";loadAll();
  }catch(e){set("⚠️ Erreur pendant la restauration. Réessayez.");toast("Erreur restauration");}
}
function _download(filename,text,type){
  try{const blob=new Blob([text],{type:type||"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1500);toast("Fichier généré");}catch(e){toast("Téléchargement impossible sur cet appareil");}
}
function downloadBackup(){
  const data={app:"AFRIKAPITAL",version:1,exportedAt:new Date().toISOString(),by:ME&&ME.email,
    clients:CLIENTS,loans:LOANS,savings:SAV,expenses:EXP,cashbook:CASH};

function csvCell(v){v=(v==null?"":String(v));if(/[",;\n]/.test(v))v='"'+v.replace(/"/g,'""')+'"';return v;}
function exportLoansCSV(){
  const head=["Client","Capital","Total","Journalier","Duree","Debut","Paye","Reste","Statut","Retard_jours"];

    lines.push([clientName(l.data.clientId),s.cap,s.total,s.daily,s.dur,s.start,s.paid,s.balance,s.status,s.arrearsDays].map(csvCell).join(";"));

/* ---------- RENOUVELLEMENTS ---------- */
function projectTreasury(days){
  const start=closeFor(bizDay());const startCash=(start===null?0:start);
  const loans=LOANS.map(loanStats).filter(s=>s.status!=="solde"&&s.daily>0).map(s=>({daily:s.daily,rem:s.balance}));
  const out=[];let cum=0;
  for(let i=1;i<=days;i++){
    let inflow=0;loans.forEach(L=>{if(L.rem>0){const p=Math.min(L.daily,L.rem);inflow+=p;L.rem-=p;}});
    cum+=inflow;out.push({day:i,date:addDays(bizDay(),i),inflow,cum,cash:startCash+cum});
  }
  const totalDue=LOANS.map(loanStats).filter(s=>s.status!=="solde").reduce((a,s)=>a+s.balance,0);
  return {startCash,out,totalDue};
}
let _besoin=0;
function projectWithRenewals(days,besoin){
  const startClose=closeFor(bizDay());const startCash=(startClose===null?0:startClose);
  let treasury=startCash-(besoin>0?besoin:0);
  const loans=LOANS.map(l=>({s:loanStats(l),name:clientName(l.data.clientId)})).filter(x=>x.s.status!=="solde"&&x.s.daily>0)
    .map(x=>({rem:x.s.balance,daily:x.s.daily,cap:x.s.cap,name:x.name,done:false}));
  const events=[];let minT=treasury,minD=bizDay();
  for(let i=1;i<=days;i++){
    const date=addDays(bizDay(),i);let inflow=0;const finishing=[];
    loans.forEach(L=>{if(L.rem>0){const p=Math.min(L.daily,L.rem);inflow+=p;L.rem-=p;if(L.rem<=0&&!L.done){L.done=true;finishing.push(L);}}});
    treasury+=inflow;let renewOut=0;const clients=[];
    finishing.forEach(L=>{renewOut+=L.cap;clients.push({name:L.name,cap:L.cap});loans.push({rem:Math.round(L.cap*(1+RATE/100)),daily:L.daily,cap:L.cap,name:L.name,done:false});});
    treasury-=renewOut;
    if(clients.length)events.push({date,clients,renewOut,inflow,treasury});
    if(treasury<minT){minT=treasury;minD=date;}
  }
  return {events,minT,minD,startCash,treasuryToday:treasury+0,besoin:besoin>0?besoin:0,afterBesoin:startCash-(besoin>0?besoin:0)};
}
function projectRenewals2y(besoin){
  const DAYS=730;
  const startClose=closeFor(bizDay());const startCash=(startClose===null?0:startClose);
  let treasury=startCash-(besoin>0?besoin:0);
  const loans=LOANS.map(l=>({s:loanStats(l),name:clientName(l.data.clientId)})).filter(x=>x.s.status!=="solde"&&x.s.daily>0)
    .map(x=>({rem:x.s.balance,daily:x.s.daily,cap:x.s.cap,name:x.name,done:false}));
  const savDaily=CLIENTS.reduce((a,c)=>a+((c.epExpress&&+c.epExpress.daily)||0)+((c.epKoor&&+c.epKoor.daily)||0),0);
  const events=[];const months={};let minT=treasury,minD=bizDay();let totalRenew=0,nbRenew=0;
  for(let i=1;i<=DAYS;i++){
    const date=addDays(bizDay(),i);let loanIn=0;const finishing=[];
    loans.forEach(L=>{if(L.rem>0){const p=Math.min(L.daily,L.rem);loanIn+=p;L.rem-=p;if(L.rem<=0&&!L.done){L.done=true;finishing.push(L);}}});
    const savIn=savDaily;treasury+=loanIn+savIn;
    let renewOut=0;const clients=[];
    finishing.forEach(L=>{renewOut+=L.cap;clients.push({name:L.name,cap:L.cap});loans.push({rem:Math.round(L.cap*(1+RATE/100)),daily:L.daily,cap:L.cap,name:L.name,done:false});});
    treasury-=renewOut;totalRenew+=renewOut;nbRenew+=clients.length;
    if(clients.length)events.push({date,clients,renewOut,dayIn:loanIn+savIn,treasury});
    const ym=date.slice(0,7);const m=(months[ym]=months[ym]||{enc:0,ren:0,end:0,nb:0});m.enc+=loanIn+savIn;m.ren+=renewOut;m.nb+=clients.length;m.end=treasury;
    if(treasury<minT){minT=treasury;minD=date;}
  }
  return {events,months,minT,minD,finalT:treasury,startCash,savDaily,totalRenew,nbRenew,besoin:besoin>0?besoin:0};
}

  el.innerHTML=`
  <div class="status" style="margin-bottom:10px">Projection sur <b>2 ans</b>. Chaque jour : on <b>collecte</b> les versements des prêts <b>et</b> les épargnes, puis on <b>renouvelle</b> (re-prêt du même capital) les clients qui terminent. Pour chaque date de renouvellement : les <b>clients</b> concernés et la <b>trésorerie disponible</b> ce jour-là.</div>
  <div class="card"><h2 style="margin-bottom:8px">📈 Trésorerie & renouvellements — 2 ans</h2>
    <div class="bal"><span>Caisse aujourd'hui</span><b>${money(F.startCash)} FCFA</b></div>
    <div class="bal"><span>Épargne collectée / jour</span><b style="color:var(--green)">+${money(F.savDaily)} FCFA</b></div>

    ${besoinLine}

}

let ONLINE=navigator.onLine!==false;
function setNet(on){
  ONLINE=on;
  const dot=$("liveDot"),txt=$("liveTxt");
  if(dot&&txt){ if(!on){dot.className="dotlive off";txt.textContent="hors ligne";} else {dot.className="dotlive";txt.textContent="en ligne";} }
}

// Exécute une écriture Supabase avec réessais automatiques (micro-coupures)
async function withRetry(fn,{tries=4,label="Enregistrement"}={}){
  let lastErr=null;
  for(let i=0;i<tries;i++){
    if(!navigator.onLine){ setNet(false); }
    try{
      const res=await fn();
      if(res&&res.error){ lastErr=res.error; }
      else { setNet(true); return {ok:true,res}; }
    }catch(e){ lastErr=e; }
    // backoff : 0.6s, 1.2s, 2.4s
    await new Promise(r=>setTimeout(r,600*Math.pow(2,i)));
  }
  return {ok:false,error:lastErr};
}

let _pdfLibs=null;
function ensurePdfLibs(){
  if(_pdfLibs)return _pdfLibs;
  _pdfLibs=new Promise((resolve,reject)=>{
    const need=[];
    if(!window.html2canvas)need.push("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
    if(!(window.jspdf&&window.jspdf.jsPDF))need.push("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    if(!need.length)return resolve();
    let done=0,failed=false;
    need.forEach(src=>{const s=document.createElement("script");s.src=src;s.onload=()=>{done++;if(done===need.length)resolve();};s.onerror=()=>{if(!failed){failed=true;reject(new Error("load"));}};document.head.appendChild(s);});
  });
  return _pdfLibs;
}
async function savePDF(baseName){
  const el=$("content");if(!el)return;
  toast("Génération du PDF…");
  try{await ensurePdfLibs();}catch(e){toast("PDF indisponible — ouverture de l'impression");window.print();return;}
  const hidden=Array.prototype.slice.call(el.querySelectorAll(".no-print"));
  hidden.forEach(n=>{n.setAttribute("data-d",n.style.display||"");n.style.display="none";});
  try{
    const canvas=await window.html2canvas(el,{scale:2,backgroundColor:"#ffffff",useCORS:true});
    const jsPDF=window.jspdf.jsPDF;const pdf=new jsPDF("p","mm","a4");
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    const imgW=pw,imgH=canvas.height*imgW/canvas.width;const img=canvas.toDataURL("image/jpeg",0.92);
    let heightLeft=imgH,position=0;
    pdf.addImage(img,"JPEG",0,position,imgW,imgH);heightLeft-=ph;
    while(heightLeft>0){position=heightLeft-imgH;pdf.addPage();pdf.addImage(img,"JPEG",0,position,imgW,imgH);heightLeft-=ph;}
    pdf.save((baseName||"afrikapital")+".pdf");toast("PDF enregistré");
  }catch(e){toast("PDF impossible — impression classique");window.print();}
  finally{hidden.forEach(n=>{n.style.display=n.getAttribute("data-d")||"";n.removeAttribute("data-d");});}
}
