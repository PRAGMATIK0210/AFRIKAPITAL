<title>Route to Market</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    color-scheme: light;
    --bg:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ed; --surface-3:#eae9e2;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --border:rgba(11,11,11,0.10); --border-strong:rgba(11,11,11,0.16);
    --grid:#e1e0d9; --axis:#c3c2b7;
    --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e6f0fc; --accent-soft-border:#c7dff8;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
    --good:#0ca30c; --warning:#c98500; --serious:#ec835a; --critical:#d03b3b;
    --good-soft:#e5f6e4; --good-border:#bfe6bc;
    --critical-soft:#fbe8e7; --critical-border:#f3c2c0;
    --warning-soft:#fdf1da; --warning-border:#eecea0;
    --muted-soft:#eeede8;
    --radius:12px; --radius-sm:8px;
    --shadow-modal: 0 12px 40px rgba(11,11,11,0.18), 0 2px 8px rgba(11,11,11,0.10);
    --font-ui: 'Public Sans', system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#202020; --surface-3:#262625;
      --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
      --border:rgba(255,255,255,0.12); --border-strong:rgba(255,255,255,0.20);
      --grid:#2c2c2a; --axis:#383835;
      --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#132844; --accent-soft-border:#1f4066;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#3fb63f; --s7:#9085e9; --s8:#e66767;
      --good:#3fc43f; --warning:#e0a834; --serious:#ec835a; --critical:#e66767;
      --good-soft:#123016; --good-border:#1e4a22;
      --critical-soft:#3a1717; --critical-border:#5c2424;
      --warning-soft:#332405; --warning-border:#5c4110;
      --muted-soft:#232322;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#202020; --surface-3:#262625;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --border:rgba(255,255,255,0.12); --border-strong:rgba(255,255,255,0.20);
    --grid:#2c2c2a; --axis:#383835;
    --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#132844; --accent-soft-border:#1f4066;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#3fb63f; --s7:#9085e9; --s8:#e66767;
    --good:#3fc43f; --warning:#e0a834; --serious:#ec835a; --critical:#e66767;
    --good-soft:#123016; --good-border:#1e4a22;
    --critical-soft:#3a1717; --critical-border:#5c2424;
    --warning-soft:#332405; --warning-border:#5c4110;
    --muted-soft:#232322;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--text-primary); font-family:var(--font-ui); -webkit-font-smoothing:antialiased; }
  h1,h2,h3,h4{ text-wrap:balance; margin:0; font-weight:700; letter-spacing:-0.01em; }
  p{ margin:0; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; font-size:14px; }
  ::selection{ background:var(--accent-soft); }
  .num{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

  #app{ display:flex; min-height:100vh; }
  .sidebar{ width:232px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:18px 12px; gap:18px; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 8px; }
  .brand-mark{ width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,var(--s1),var(--s3)); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:14px; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text b{ font-size:14px; font-weight:800; }
  .brand-text span{ font-size:11px; color:var(--text-muted); }
  .nav-section-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); padding:10px 10px 2px; }
  .nav-item{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius-sm); color:var(--text-secondary);
    font-size:13.5px; font-weight:600; cursor:pointer; border:1px solid transparent; }
  .nav-item:hover{ background:var(--surface-2); }
  .nav-item.active{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent-soft-border); }
  .nav-item svg{ width:17px; height:17px; flex-shrink:0; }
  .sidebar-foot{ margin-top:auto; padding:8px; border-top:1px solid var(--border); font-size:11px; color:var(--text-muted); }

  .main-col{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar{ height:60px; flex-shrink:0; border-bottom:1px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:space-between; padding:0 22px; position:sticky; top:0; z-index:20; }
  .topbar-title{ font-size:16px; font-weight:700; }
  .topbar-right{ display:flex; align-items:center; gap:12px; }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--good); flex-shrink:0; }
  .sync-dot.off{ background:var(--text-muted); }
  .sync-label{ font-size:11.5px; color:var(--text-muted); display:flex; align-items:center; gap:6px; }
  .profile-chip{ display:flex; align-items:center; gap:8px; padding:5px 10px 5px 5px; border-radius:99px; border:1px solid var(--border);
    background:var(--surface-2); cursor:pointer; font-size:13px; font-weight:600; }
  .avatar{ width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; flex-shrink:0; }
  .avatar.lg{ width:44px; height:44px; font-size:16px; }

  .content{ flex:1; padding:22px 26px 60px; overflow-y:auto; max-width:1280px; width:100%; }
  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
  .page-head h1{ font-size:21px; }
  .page-sub{ color:var(--text-secondary); font-size:13px; margin-top:3px; }

  .btn{ display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:var(--radius-sm); border:1px solid var(--border-strong);
    background:var(--surface); color:var(--text-primary); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .btn:hover{ background:var(--surface-2); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.ghost{ border-color:transparent; background:transparent; }
  .btn.ghost:hover{ background:var(--surface-2); }
  .btn.sm{ padding:5px 10px; font-size:12px; }
  .btn.danger{ color:var(--critical); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn svg{ width:14px; height:14px; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
  .card + .card{ margin-top:14px; }
  .card-title{ font-size:13.5px; font-weight:700; margin-bottom:2px; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap; }

  .kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:10px; margin-bottom:14px; }
  .kpi-tile{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 15px; }
  .kpi-label{ font-size:11.5px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .kpi-value{ font-family:var(--font-mono); font-size:23px; font-weight:600; margin-top:6px; font-variant-numeric:tabular-nums; }
  .kpi-sub{ font-size:11.5px; color:var(--text-secondary); margin-top:4px; }

  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:900px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }

  .zone-group{ margin-bottom:16px; }
  .zone-title{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    color:var(--text-muted); margin-bottom:8px; }
  .zone-count{ background:var(--surface-3); color:var(--text-secondary); border-radius:99px; padding:1px 8px; font-size:11px; font-weight:700; }

  .client-row{ display:flex; align-items:center; gap:12px; padding:11px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface); cursor:pointer; margin-bottom:7px; }
  .client-row:hover{ border-color:var(--border-strong); background:var(--surface-2); }
  .client-main{ flex:1; min-width:0; }
  .client-name{ font-size:14px; font-weight:700; display:flex; align-items:center; gap:7px; }
  .client-meta{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .frigo-badge{ display:inline-flex; align-items:center; gap:3px; font-size:10.5px; font-weight:700; color:var(--s1); background:var(--accent-soft);
    border:1px solid var(--accent-soft-border); border-radius:99px; padding:1px 7px; }

  .status-pill{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; white-space:nowrap; flex-shrink:0; }
  .status-pill.good{ background:var(--good-soft); color:var(--good); border:1px solid var(--good-border); }
  .status-pill.critical{ background:var(--critical-soft); color:var(--critical); border:1px solid var(--critical-border); }
  .status-pill.warning{ background:var(--warning-soft); color:var(--warning); border:1px solid var(--warning-border); }
  .status-pill.muted{ background:var(--muted-soft); color:var(--text-muted); border:1px solid var(--border); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); font-weight:700;
    padding:0 10px 8px; border-bottom:1px solid var(--border); }
  td{ padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  .table-wrap{ overflow-x:auto; }
  .progress{ height:7px; border-radius:99px; background:var(--surface-3); overflow:hidden; width:100%; min-width:70px; }
  .progress > div{ height:100%; background:var(--accent); border-radius:99px; }

  label.field{ display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--text-secondary); }
  input[type=text],input[type=number],input[type=tel],input[type=date],select,textarea{
    padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--border-strong); background:var(--surface); color:var(--text-primary); width:100%; }
  textarea{ resize:vertical; min-height:64px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; }
  .chip-select{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip-opt{ padding:6px 11px; border-radius:99px; border:1px solid var(--border-strong); font-size:12.5px; font-weight:600; cursor:pointer; background:var(--surface); }
  .chip-opt.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(11,11,11,0.45); display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow-y:auto; z-index:100; }
  .modal{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow-modal); width:100%; max-width:640px; padding:22px; }
  .modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .modal-close{ cursor:pointer; color:var(--text-muted); border:none; background:none; padding:4px; }

  .toast-root{ position:fixed; bottom:18px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:200; }
  .toast{ background:var(--text-primary); color:var(--bg); padding:10px 14px; border-radius:var(--radius-sm); font-size:13px; font-weight:600;
    box-shadow:var(--shadow-modal); max-width:320px; }
  .toast.good{ background:var(--good); color:#06210a; }
  .toast.critical{ background:var(--critical); color:#fff; }
  .toast.warning{ background:var(--warning); color:#221800; }

  .banner{ display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--accent-soft); border:1px solid var(--accent-soft-border);
    color:var(--accent); border-radius:var(--radius-sm); padding:10px 14px; font-size:12.5px; font-weight:600; margin-bottom:16px; }

  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{ width:100%; max-width:640px; }
  .login-title{ text-align:center; margin-bottom:22px; }
  .role-tabs{ display:flex; gap:8px; justify-content:center; margin-bottom:18px; }
  .role-tab{ padding:8px 18px; border-radius:99px; border:1px solid var(--border-strong); font-weight:700; font-size:13px; cursor:pointer; background:var(--surface); }
  .role-tab.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .profile-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
  .profile-card{ display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); cursor:pointer; }
  .profile-card:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .profile-card b{ font-size:13.5px; display:block; }
  .profile-card span{ font-size:11.5px; color:var(--text-muted); }

  .tooltip{ position:fixed; background:var(--text-primary); color:var(--bg); font-size:12px; font-weight:600; padding:6px 9px; border-radius:6px;
    pointer-events:none; z-index:300; box-shadow:var(--shadow-modal); white-space:nowrap; }
  .chart-empty{ color:var(--text-muted); font-size:12.5px; padding:20px 0; text-align:center; }
  .dyn-row{ display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .dyn-row > *{ flex:1; }
  .divider{ height:1px; background:var(--border); margin:14px 0; }
  .helptext{ font-size:11.5px; color:var(--text-muted); margin-top:3px; }
  .badge-count{ background:var(--surface-3); border-radius:99px; padding:1px 8px; font-size:11px; font-weight:700; color:var(--text-secondary); }
  .demo-banner{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--warning-soft); border:1px solid var(--warning-border);
    color:var(--warning); padding:9px 14px; border-radius:var(--radius-sm); font-size:12px; font-weight:600; margin-bottom:16px; }
  .icon-btn{ width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:99px; border:1px solid var(--border); background:var(--surface); cursor:pointer; color:var(--text-secondary); }
  .checklist-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px; }
  .checklist-item{ display:flex; align-items:center; gap:7px; padding:7px 9px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:12.5px; font-weight:600; cursor:pointer; }
  .checklist-item.on{ background:var(--accent-soft); border-color:var(--accent-soft-border); color:var(--accent); }
  .gps-box{ border:1px dashed var(--border-strong); border-radius:var(--radius-sm); padding:10px 12px; font-size:12.5px; }
  .empty-state{ text-align:center; padding:40px 20px; color:var(--text-muted); font-size:13px; }
</style>

<div id="app"></div>
<div class="toast-root" id="toast-root"></div>

function fmtFCFA(n){ n = Math.round(n||0); return n.toLocaleString('fr-FR') + ' FCFA'; }
function fmtNum(n){ return Math.round(n||0).toLocaleString('fr-FR'); }
function pad2(n){ return String(n).padStart(2,'0'); }
function todayDate(){ return new Date(); }
function isoDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayISO(){ return isoDate(todayDate()); }
function todayWeekdayFR(){ return JOURS_FR[todayDate().getDay()]; }
function monthKey(iso){ return iso ? iso.slice(0,7) : ''; }
function fmtDateFR(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function fmtDateTimeFR(iso){
  if(!iso) return '—';
  try{ const d = new Date(iso); return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return iso; }
}
function daysBetween(iso1, iso2){
  const a = new Date(iso1+'T00:00:00'), b = new Date(iso2+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function haversineM(lat1,lng1,lat2,lng2){
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.asin(Math.sqrt(a));
}

/* ============================== STOCKAGE LOCAL (mode autonome, sans serveur) ==============================
   Cette version fonctionne entièrement dans le navigateur : les données (clients, ventes, fiches) sont
   enregistrées dans le stockage local de CE navigateur, sur CET appareil. Elles ne sont donc pas partagées
   automatiquement entre le téléphone d'un commercial et celui d'un superviseur — pratique pour tester,
   mais pour un vrai déploiement multi-utilisateurs il faut la version connectée (base de données partagée). */
const LS_DATA_KEY = 'rtm_local_data_v2';
let renderScheduled = false;
function scheduleRender(){
  if(renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(()=>{ renderScheduled = false; render(); });
}
function genId(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function collectionMap(name){
  return {profils:APP.profils, produits:APP.produits, clients:APP.clients, visites:APP.visites, fichesSuperviseur:APP.fiches}[name];
}
function loadLocalData(){
  let raw = null;
  try{ raw = localStorage.getItem(LS_DATA_KEY); }catch(e){}
  let data = null;
  if(raw){ try{ data = JSON.parse(raw); }catch(e){ data = null; } }
  if(!data) data = JSON.parse(JSON.stringify(SEED_DATA));
  APP.profils.clear(); (data.profils||[]).forEach(p=>APP.profils.set(p.id, p));
  APP.produits.clear(); (data.produits||[]).forEach(p=>APP.produits.set(p.id, p));
  APP.clients.clear(); (data.clients||[]).forEach(c=>APP.clients.set(c.id, c));
  APP.visites.clear(); (data.visites||[]).forEach(v=>APP.visites.set(v.id, v));
  APP.fiches.clear(); (data.fichesSuperviseur||[]).forEach(f=>APP.fiches.set(f.id, f));
}
function persistLocalData(){
  const dump = {
    profils:[...APP.profils.values()], produits:[...APP.produits.values()], clients:[...APP.clients.values()],
    visites:[...APP.visites.values()], fichesSuperviseur:[...APP.fiches.values()],
  };
  try{ localStorage.setItem(LS_DATA_KEY, JSON.stringify(dump)); APP.lastSaved = new Date(); }
  catch(e){ console.error('Sauvegarde locale impossible', e); toast('Stockage local indisponible (mode navigation privée ?)', 'critical'); }
}
function resetLocalData(){
  try{ localStorage.removeItem(LS_DATA_KEY); }catch(e){}
  loadLocalData(); persistLocalData(); toast('Données de démonstration réinitialisées.', 'good'); render();
}
const LocalDB = {
  collection(name){
    return { add(data){
      return new Promise(resolve=>{
        const id = genId(name[0]||'x');
        const rec = Object.assign({id}, data);
        collectionMap(name).set(id, rec);
        persistLocalData(); scheduleRender();
        resolve({id});
      });
    }};
  },
  doc(path){
    const idx = path.indexOf('/');
    const name = path.slice(0, idx), id = path.slice(idx+1);
    return {
      update(patch){
        return new Promise((resolve,reject)=>{
          const map = collectionMap(name); const cur = map.get(id);
          if(!cur){ reject(new Error('Document introuvable')); return; }
          map.set(id, Object.assign({}, cur, patch));
          persistLocalData(); scheduleRender(); resolve();
        });
      },
      set(data){
        return new Promise(resolve=>{
          collectionMap(name).set(id, Object.assign({id}, data));
          persistLocalData(); scheduleRender(); resolve();
        });
      },
    };
  },
};
const LocalDownloads = {
  save({filename, data}){
    return new Promise(resolve=>{
      const blob = data instanceof Blob ? data : new Blob([data]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      resolve({status:'saved'});
    });
  }
};

function boot(){
  APP.db = LocalDB;
  APP.downloads = LocalDownloads;
  APP.dbReady = true;
  loadLocalData();
  restoreSession();
  window.addEventListener('hashchange', ()=>{ APP.route = location.hash || null; render(); });
  render();
}
function restoreSession(){
  try{
    const saved = localStorage.getItem('rtm_profile_id');
    if(saved){ APP.currentUser = {id: saved}; } // resolved fully once profils load, in render()

}

function clearSession(){ try{ localStorage.removeItem('rtm_profile_id'); }catch(e){} APP.currentUser = null; }

function firstSaleFor(clientId){
  const ventes = visitesForClient(clientId).filter(v=>v.statut==='vendu');

  return [...APP.clients.values()].filter(c=>c.commercialId===commercialId && (c.statut==='prospect' || c.statut==='a_valider' || c.origineProspection))
    .sort((a,b)=> (a.dateCreation||'') < (b.dateCreation||'') ? 1 : -1);

  return [...APP.fiches.values()].filter(f=>f.superviseurId===superviseurId).sort((a,b)=> (a.date<b.date?1:-1));

function visitesForClient(clientId){
  return [...APP.visites.values()].filter(v=>v.clientId===clientId).sort((a,b)=> (a.date<b.date?1:-1));
}
function visiteToday(clientId, commercialId){
  const t = todayISO();
  return [...APP.visites.values()].find(v=>v.clientId===clientId && v.commercialId===commercialId && v.date===t) || null;
}
function lastVisitDate(clientId){
  const vs = visitesForClient(clientId);
  return vs.length ? vs[0].date : null;
}
function realizedForClientMonth(clientId, ym){
  return [...APP.visites.values()].filter(v=>v.clientId===clientId && v.statut==='vendu' && monthKey(v.date)===ym)
    .reduce((s,v)=>s+(v.montantTotal||0),0);
}
function suggestObjective(clientId){
  // Objectif lissé sur l'historique des achats du client : lissage exponentiel sur les 6 derniers
  // mois (les mois les plus récents pèsent davantage), avec une marge de progression de +10%.
  const now = todayDate();
  const months = [];
  for(let i=1;i<=6;i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push(d.getFullYear()+'-'+pad2(d.getMonth()+1));
  }
  const sums = months.map(m=>realizedForClientMonth(clientId, m));
  const withData = sums.map((s,i)=>({s,i})).filter(o=>o.s>0);
  if(!withData.length) return 200000;
  const alpha = 0.5;
  let weightedSum = 0, weightTotal = 0;
  withData.forEach(({s,i})=>{ const w = Math.pow(1-alpha, i); weightedSum += s*w; weightTotal += w; });
  const lisse = weightedSum/weightTotal;
  return Math.round((lisse*1.1)/5000)*5000;
}
function periodCutoff(days){
  const d = new Date(); d.setDate(d.getDate()-days); return isoDate(d);
}
function isProspectionMode(m){ return m==='seul_prospection' || m==='avec_commercial_prospection'; }
function modeVisiteLabel(m, short){
  if(m==='seul_prospection') return short ? 'Prospection' : 'Prospection seul(e)';
  if(m==='avec_commercial_prospection') return short ? 'Avec com. — prosp.' : 'Avec commercial — prospection';
  if(m==='seul') return 'Seul(e)';
  return short ? 'Avec com.' : 'Avec commercial';
}
function filteredVisites({commercialId, secteur, sinceISO, toISO}){
  return [...APP.visites.values()].filter(v=>{
    if(sinceISO && v.date < sinceISO) return false;
    if(toISO && v.date > toISO) return false;
    const c = APP.clients.get(v.clientId);
    if(commercialId && v.commercialId!==commercialId) return false;
    if(secteur && (!c || c.secteur!==secteur)) return false;
    return true;
  });
}

function wireDateRange(container, idPrefix, onChange){
  const fromEl = container.querySelector('#'+idPrefix+'-from');
  const toEl = container.querySelector('#'+idPrefix+'-to');

    let from = fromEl.value, to = toEl.value;
    if(from && to && from > to){ toEl.value = from; to = from; }

function defaultRoute(user){
  if(!user) return '#/login';
  if(user.role==='superviseur') return '#/fiche';
  if(user.role==='direction') return '#/activite';
  if(user.role==='adv') return '#/comptes';
  return '#/tournee';
}
function routeAllowed(user, route){
  return navFor(user).some(it=>it.r===route);
}
function setRoute(route){ location.hash = route; APP.route = route; render(); }

function resolveCurrentUser(){
  if(APP.currentUser && !APP.currentUser.role){
    const full = APP.profils.get(APP.currentUser.id);
    if(full) APP.currentUser = full;
  }
  return APP.currentUser && APP.currentUser.role ? APP.currentUser : null;
}

function render(){
  const root = document.getElementById('app');
  const user = resolveCurrentUser();
  if(!APP.dbReady){
    root.innerHTML = renderLoadingHTML();
    return;
  }
  if(!user){
    root.innerHTML = renderLoginHTML();
    wireLogin();
    return;
  }
  if(!APP.route || APP.route==='#/login' || !routeAllowed(user, APP.route)) APP.route = defaultRoute(user);
  root.innerHTML = renderShellHTML(user);
  wireShell(user);
  const content = document.getElementById('content');
  renderRoute(content, user, APP.route);
}

  const allDates = mineAll.map(v=>v.date).sort();
  const earliest = allDates[0] || periodCutoff(30);
  content.innerHTML = `
    ${demoBannerHTML()}
    <div class="page-head"><div><h1>Historique des tournées</h1><p class="page-sub" id="hist-sub"></p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">${dateRangeHTML('hist', earliest, todayISO())}</div>
    </div>
    <div class="grid-2" style="grid-template-columns:260px 1fr;align-items:start;">
      <div class="card" style="padding:10px;">
        <div class="card-title" style="padding:4px 6px 8px;">Journées</div>
        <div id="hist-date-list" style="max-height:520px;overflow-y:auto;"></div>
      </div>
      <div class="card" id="hist-detail"></div>
    </div>
  `;
  wireDemoBanner(content);
  const listBox = content.querySelector('#hist-date-list');
  let mine = mineAll, dates = allDates.slice().sort((a,b)=> a<b?1:-1);
  let selected = dates[0] || todayISO();
  function applyRange(from, to){
    mine = mineAll.filter(v=>v.date>=from && v.date<=to);
    dates = [...new Set(mine.map(v=>v.date))].sort((a,b)=> a<b?1:-1);
    content.querySelector('#hist-sub').textContent = `${dates.length} journée${dates.length>1?'s':''} avec au moins un passage enregistré sur la période choisie.`;
    if(!dates.includes(selected)) selected = dates[0] || todayISO();
    renderList(); renderDetail();
  }
  wireDateRange(content, 'hist', applyRange);
  function renderList(){
    if(!dates.length){ listBox.innerHTML = `<div class="empty-state">Aucun passage enregistré sur cette période.</div>`; return; }
    listBox.innerHTML = dates.map(d=>{
      const day = mine.filter(v=>v.date===d);
      const ca = day.filter(v=>v.statut==='vendu').reduce((s,v)=>s+v.montantTotal,0);
      return `<div class="nav-item ${d===selected?'active':''}" data-date="${d}" style="flex-direction:column;align-items:flex-start;gap:2px;">
        <span>${fmtDateFR(d)}</span><span class="helptext" style="margin:0;">${day.length} passage${day.length>1?'s':''} · ${fmtNum(ca)} FCFA</span>
      </div>`;
    }).join('');
    listBox.querySelectorAll('[data-date]').forEach(el=>el.addEventListener('click', ()=>{ selected = el.getAttribute('data-date'); renderList(); renderDetail(); }));
  }
  function renderDetail(){
    const box = content.querySelector('#hist-detail');
    if(!selected){ box.innerHTML = `<div class="empty-state">Sélectionnez une journée.</div>`; return; }
    const day = mine.filter(v=>v.date===selected).sort((a,b)=> (a.timestamp||'')<(b.timestamp||'')?-1:1);
    const ca = day.filter(v=>v.statut==='vendu').reduce((s,v)=>s+v.montantTotal,0);
    const vendus = day.filter(v=>v.statut==='vendu').length;
    box.innerHTML = `
      <div class="card-head">
        <div><div class="card-title" style="margin:0;">Tournée du ${fmtDateFR(selected)}</div>
          <span class="helptext">${day.length} client${day.length>1?'s':''} visité${day.length>1?'s':''} · ${vendus} vente${vendus>1?'s':''} · ${fmtNum(ca)} FCFA</span></div>
        <button class="btn primary sm" id="hist-pdf">${icon('pdf')} Enregistrer en PDF</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Heure</th><th>Client</th><th>Zone</th><th>Statut</th><th>Détail</th><th>Position</th></tr></thead><tbody>
        ${day.map(v=>{ const c = APP.clients.get(v.clientId);
          const heure = v.timestamp ? fmtDateTimeFR(v.timestamp).split(' ')[1]||'' : '';
          const detail = v.statut==='vendu' ? fmtFCFA(v.montantTotal) : (v.raisonNonAchat||'—');
          const pos = v.gps ? (v.gps.distanceM<=300?`<span class="status-pill good">✓ ${v.gps.distanceM} m</span>`:`<span class="status-pill warning">${v.gps.distanceM} m</span>`) : '—';
          return `<tr><td class="num">${heure}</td><td>${c?escapeHtml(c.nom):'—'}</td><td>${c?escapeHtml(c.zone):'—'}</td>
            <td>${v.statut==='vendu'?'<span class="status-pill good">Vendu</span>':'<span class="status-pill critical">Non vendu</span>'}</td>
            <td class="num">${detail}</td><td>${pos}</td></tr>`;
        }).join('') || `<tr><td colspan="6" class="empty-state">Aucun passage ce jour-là.</td></tr>`}
      </tbody></table></div>
    `;
    const pdfBtn = box.querySelector('#hist-pdf');
    if(pdfBtn) pdfBtn.addEventListener('click', ()=>exportTourneePDF(selected, user, day));
  }
  applyRange(earliest, todayISO());
}

async function exportTourneePDF(dateISO, user, dayVisites){
  if(typeof window.jspdf === 'undefined'){ toast('Bibliothèque PDF non chargée. Vérifiez votre connexion.', 'critical'); return; }
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const marginX = 40; let y = 50;
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text('Route to Market — Rapport de tournée', marginX, y); y+=22;
    doc.setFontSize(11); doc.setFont('helvetica','normal');
    doc.text(`Commercial : ${user.nom}`, marginX, y); y+=16;
    doc.text(`Date : ${fmtDateFR(dateISO)}`, marginX, y); y+=16;
    const ca = dayVisites.filter(v=>v.statut==='vendu').reduce((s,v)=>s+v.montantTotal,0);
    const vendus = dayVisites.filter(v=>v.statut==='vendu').length;
    doc.text(`${dayVisites.length} client(s) visité(s) — ${vendus} vente(s) — Chiffre d'affaires : ${fmtNum(ca)} FCFA`, marginX, y); y+=26;
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    const cols = [['Heure',marginX],['Client',marginX+55],['Zone',marginX+195],['Statut',marginX+280],['Détail',marginX+345],['Position',marginX+460]];
    cols.forEach(([label,x])=>doc.text(label,x,y));
    y+=6; doc.setLineWidth(0.5); doc.line(marginX, y, 555, y); y+=14;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    dayVisites.forEach(v=>{
      if(y>770){ doc.addPage(); y=50; }
      const c = APP.clients.get(v.clientId);
      const heure = v.timestamp ? (fmtDateTimeFR(v.timestamp).split(' ')[1]||'') : '';
      const detail = v.statut==='vendu' ? fmtFCFA(v.montantTotal) : (v.raisonNonAchat||'—');
      const pos = v.gps ? v.gps.distanceM+' m' : '—';
      doc.text(String(heure), marginX, y);
      doc.text(String(c?c.nom:'—').slice(0,26), marginX+55, y);
      doc.text(String(c?c.zone:'—'), marginX+195, y);
      doc.text(v.statut==='vendu'?'Vendu':'Non vendu', marginX+280, y);
      doc.text(String(detail).slice(0,20), marginX+345, y);
      doc.text(String(pos), marginX+460, y);
      y+=15;
    });
    const filename = `tournee-${(user.nom||'commercial').replace(/\s+/g,'_')}-${dateISO}.pdf`;
    if(APP.downloads){
      const blob = doc.output('blob');
      await APP.downloads.save({filename, data: blob});
      toast('Rapport PDF enregistré.', 'good');
    } else {
      doc.save(filename);
      toast('Rapport PDF téléchargé.', 'good');
    }
  }catch(e){
    if(e && e.code==='declined'){ /* silencieux */ }
    else { console.error(e); toast('Export PDF impossible : '+(e&&e.message?e.message:'erreur inconnue'), 'critical'); }
  }
}

function renderJournalProspects(content, user){
  const allProspects = myProspectsHistory(user.id);
  const allDates = allProspects.map(c=>c.dateCreation).filter(Boolean).sort();
  const earliest = allDates[0] || periodCutoff(90);
  content.innerHTML = `

    <div class="card"><div class="table-wrap" id="pj-table"></div></div>
  `;
  wireDemoBanner(content);
  const box = content.querySelector('#pj-table');
  function apply(from, to){
    const prospects = allProspects.filter(c=> !c.dateCreation || (c.dateCreation>=from && c.dateCreation<=to));
    const enAttente = prospects.filter(c=>c.statut==='prospect').length;
    const convertis = prospects.filter(c=>c.statut==='actif').length;
    const taux = prospects.length ? Math.round(convertis/prospects.length*100) : 0;
    const caGenere = prospects.reduce((s,c)=> s + visitesForClient(c.id).filter(v=>v.statut==='vendu').reduce((s2,v)=>s2+v.montantTotal,0), 0);
    content.querySelector('#pj-kpis').innerHTML = `
      <div class="kpi-tile"><div class="kpi-label">Prospects reçus</div><div class="kpi-value">${prospects.length}</div></div>
      <div class="kpi-tile"><div class="kpi-label">En attente de 1ère visite</div><div class="kpi-value">${enAttente}</div></div>

    `;
    if(!prospects.length){ box.innerHTML = `<div class="empty-state">Aucun prospect enregistré sur cette période.</div>`; return; }
    box.innerHTML = `<table><thead><tr><th>Nom</th><th>Zone</th><th>Origine</th><th>Reçu le</th><th>Statut</th><th>Visites</th><th>Dernière visite</th><th>CA généré</th></tr></thead><tbody>
      ${prospects.map(c=>{
        const visites = visitesForClient(c.id);
        const vendues = visites.filter(v=>v.statut==='vendu');
        const ca = vendues.reduce((s,v)=>s+v.montantTotal,0);
        const derniere = visites.length ? fmtDateFR(visites[0].date) : 'jamais';
        const origine = c.origineProspection==='superviseur'
          ? `Transmis par ${escapeHtml((APP.profils.get(c.superviseurId)||{}).nom||'un superviseur')}`
          : 'Prospection terrain';
        const statut = c.statut==='actif'
          ? `<span class="status-pill good">✓ Client actif${vendues.length?' depuis le '+fmtDateFR(vendues[vendues.length-1].date):''}</span>`
          : (c.statut==='a_valider' ? `<span class="status-pill muted">En attente ADV</span>` : `<span class="status-pill warning">En attente de 1ère visite</span>`);
        return `<tr data-client="${c.id}"><td>${escapeHtml(c.nom)}</td><td>${escapeHtml(c.zone||c.secteur||'')}</td><td class="helptext">${origine}</td>
          <td>${c.dateCreation?fmtDateFR(c.dateCreation):'—'}</td><td>${statut}</td><td class="num">${visites.length}</td>
          <td>${derniere}</td><td class="num">${fmtNum(ca)}</td></tr>`;
      }).join('')}
    </tbody></table>`;
    box.querySelectorAll('tr[data-client]').forEach(row=>row.addEventListener('click', ()=>openClientModal(row.getAttribute('data-client'), user)));
  }
  wireDateRange(content, 'pj', apply);
  apply(earliest, todayISO());
}

function renderVisitForm(box, c, user, existing, backdrop){
  if(existing){
    box.innerHTML = `<div class="status-pill ${existing.statut==='vendu'?'good':'critical'}" style="display:inline-block;margin-bottom:8px;">
      ${existing.statut==='vendu' ? 'Vendu · '+fmtFCFA(existing.montantTotal) : 'Non vendu · '+escapeHtml(existing.raisonNonAchat||'')}</div>
      <p class="helptext">Passage déjà enregistré aujourd'hui à ${fmtDateTimeFR(existing.timestamp).split(' ')[1]||''}.
      ${existing.gps ? ' Position à '+existing.gps.distanceM+' m du client.' : ''}</p>`;
    return;
  }
  let gps = null;
  let vendu = true;
  let produitsChoisis = new Set();
  let montantSaisi = '';
  let concurrentChoisi = '';
  function renderInner(){
    box.innerHTML = `
      <div class="chip-select" style="margin-bottom:10px;">
        <div class="chip-opt ${vendu?'on':''}" data-v="1">Vendu</div>
        <div class="chip-opt ${!vendu?'on':''}" data-v="0">Non vendu</div>
      </div>
      <div id="lines-box"></div>
      <div id="raison-box"></div>
      <label class="field" style="margin:10px 0;">Concurrent identifié en boutique (facultatif)
        <select id="concurrent-select">
          <option value="">Aucun concurrent identifié</option>
          ${CONCURRENTS.map(nom=>`<option value="${escapeHtml(nom)}" ${concurrentChoisi===nom?'selected':''}>${escapeHtml(nom)}</option>`).join('')}
        </select>
      </label>
      <div class="gps-box" id="gps-box" style="margin:10px 0;">
        ${gps ? `<b>${gps.distanceM<=300?'✓ Position confirmée':'⚠ Position éloignée'}</b> · ${gps.distanceM} m du client enregistré`
              : `Vérifiez votre position pour confirmer la visite.`}
        <div style="margin-top:6px;"><button class="btn sm" id="gps-btn">${icon('pin')} Vérifier ma position</button></div>
      </div>
      <button class="btn primary" id="submit-visit" style="width:100%;justify-content:center;">Enregistrer le passage</button>
    `;
    box.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click', ()=>{ vendu = b.getAttribute('data-v')==='1'; renderInner(); }));
    box.querySelector('#concurrent-select').addEventListener('change', e=>{ concurrentChoisi = e.target.value; });
    box.querySelector('#gps-btn').addEventListener('click', ()=>{
      const btn = box.querySelector('#gps-btn'); btn.disabled = true; btn.textContent='Localisation…';
      if(!navigator.geolocation){ toast('Géolocalisation indisponible sur cet appareil.', 'warning'); renderInner(); return; }
      navigator.geolocation.getCurrentPosition(pos=>{
        const dist = Math.round(haversineM(pos.coords.latitude, pos.coords.longitude, c.lat, c.lng));
        gps = {lat: pos.coords.latitude, lng: pos.coords.longitude, distanceM: dist};
        renderInner();
      }, err=>{
        toast('Position indisponible ('+(err.message||'refusée')+'). Vous pouvez continuer sans GPS.', 'warning');
        renderInner();
      }, {timeout:8000, enableHighAccuracy:true});
    });
    if(vendu) renderProduitsVendus(); else renderRaison();
    box.querySelector('#submit-visit').addEventListener('click', ()=>submitVisit());
  }
  function renderProduitsVendus(){
    const lb = box.querySelector('#lines-box');
    const cats = [...APP.produits.values()];
    lb.innerHTML = `<div class="helptext" style="margin-bottom:6px;">Produits vendus (catégories, sans quantité)</div>
      <div class="checklist-grid" id="produits-checklist"></div>
      <label class="field" style="margin-top:10px;">Montant de la facture (FCFA)<input type="number" min="0" step="500" id="montant-input" placeholder="Ex : 25000" value="${escapeHtml(String(montantSaisi||''))}"></label>`;
    const cl = lb.querySelector('#produits-checklist');
    cats.forEach(p=>{
      const it = document.createElement('div'); it.className='checklist-item'+(produitsChoisis.has(p.id)?' on':'');
      it.textContent = p.nom;
      it.addEventListener('click', ()=>{
        if(produitsChoisis.has(p.id)){ produitsChoisis.delete(p.id); it.classList.remove('on'); }
        else { produitsChoisis.add(p.id); it.classList.add('on'); }
      });
      cl.appendChild(it);
    });
    lb.querySelector('#montant-input').addEventListener('input', e=>{ montantSaisi = e.target.value; });
  }
  function renderRaison(){
    const lb = box.querySelector('#lines-box');
    lb.innerHTML = `<label class="field">Raison du non-achat
      <select id="raison-select">${RAISONS_NON_ACHAT.map(r=>`<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('')}</select>
    </label>`;
  }
  async function submitVisit(){
    if(!APP.db) return;
    const btn = box.querySelector('#submit-visit'); btn.disabled = true; btn.textContent = 'Enregistrement…';
    let payload = {
      clientId: c.id, commercialId: user.id, date: todayISO(), timestamp: new Date().toISOString(),
      gps: gps || null, concurrence: concurrentChoisi || '',
    };
    if(vendu){
      if(!produitsChoisis.size){ toast('Sélectionnez au moins une catégorie de produit vendue.', 'warning'); btn.disabled=false; btn.textContent='Enregistrer le passage'; return; }
      const montant = Number(montantSaisi)||0;
      if(!montant){ toast('Indiquez le montant de la facture.', 'warning'); btn.disabled=false; btn.textContent='Enregistrer le passage'; return; }
      payload.statut='vendu'; payload.produitsVendus=[...produitsChoisis]; payload.montantTotal=montant; payload.raisonNonAchat=null;
    } else {
      const raison = box.querySelector('#raison-select') ? box.querySelector('#raison-select').value : RAISONS_NON_ACHAT[0];
      payload.statut='non_vendu'; payload.produitsVendus=[]; payload.montantTotal=0; payload.raisonNonAchat=raison;
    }
    try{
      await APP.db.collection('visites').add(payload);
      if(vendu && (c.statut==='prospect' || c.statut==='a_valider')){
        try{ await APP.db.doc(`clients/${c.id}`).update({statut:'a_valider', venteEnAttenteDate: todayISO()}); toast('Vente enregistrée — en attente de création du compte par l\'ADV.', 'good'); }
        catch(e){ toast('Passage enregistré.', 'good'); }
      } else {
        toast('Passage enregistré.', 'good');
      }
      if(backdrop) backdrop.remove();
    }catch(e){ toast('Échec de l\'enregistrement.', 'critical'); btn.disabled=false; btn.textContent='Enregistrer le passage'; }
  }
  renderInner();
}

/* ---- projection géographique (équirectangulaire, corrigée en latitude) ---- */
function geoBoundsOf(points){
  const lats = points.map(p=>p[1]), lngs = points.map(p=>p[0]);
  return {minLat:Math.min(...lats), maxLat:Math.max(...lats), minLng:Math.min(...lngs), maxLng:Math.max(...lngs)};
}
function projectGeo(lng, lat, bounds, w, h, pad){
  const cosLat = Math.cos((bounds.minLat+bounds.maxLat)/2 * Math.PI/180) || 1;
  const spanX = Math.max((bounds.maxLng-bounds.minLng)*cosLat, 0.0001);
  const spanY = Math.max(bounds.maxLat-bounds.minLat, 0.0001);
  const scale = Math.min((w-2*pad)/spanX, (h-2*pad)/spanY);
  const offX = pad + (w-2*pad-spanX*scale)/2;
  const offY = pad + (h-2*pad-spanY*scale)/2;
  return [offX + (lng-bounds.minLng)*cosLat*scale, offY + (bounds.maxLat-lat)*scale];
}
function drawSenegalMap(container, clients){
  container.innerHTML = '';
  const W=320, H=300, PAD=12;
  const bounds = geoBoundsOf(SENEGAL_OUTLINE);
  const svg = svgEl('svg', {viewBox:`0 0 ${W} ${H}`, width:'100%', height:280, style:'display:block;'});
  const d = 'M' + SENEGAL_OUTLINE.map(([lng,lat])=>projectGeo(lng,lat,bounds,W,H,PAD).map(n=>n.toFixed(1)).join(',')).join(' L') + ' Z';
  svg.appendChild(svgEl('path', {d, fill:'var(--accent-soft)', stroke:'var(--accent)', 'stroke-width':1.4, 'stroke-linejoin':'round'}));
  const [dx,dy] = projectGeo(DAKAR_COORD.lng, DAKAR_COORD.lat, bounds, W, H, PAD);
  svg.appendChild(svgEl('circle', {cx:dx,cy:dy,r:10, fill:'var(--accent)', opacity:0.22}));
  svg.appendChild(svgEl('circle', {cx:dx,cy:dy,r:4, fill:'var(--accent)', stroke:'var(--surface)', 'stroke-width':1.5}));
  const label = svgEl('text', {x:dx+8, y:dy-6, 'font-size':11, 'font-weight':700, fill:'var(--text-primary)'});
  label.textContent = 'Dakar'; svg.appendChild(label);
  container.appendChild(svg);
  const cap = document.createElement('div');
  cap.style.cssText = 'font-size:11.5px;color:var(--text-secondary);margin-top:4px;';
  cap.textContent = `Zone d'intervention : région de Dakar (Cap-Vert) — ${clients.length} point(s) de vente.`;
  container.appendChild(cap);
}

function drawZoneMap(container, clients, user){
  container.innerHTML = '';
  if(!clients.length){ container.innerHTML = `<div class="chart-empty">Aucun client à afficher.</div>`; return; }
  const W=900,H=280,PAD=24;
  const bounds = geoBoundsOf(clients.map(c=>[c.lng,c.lat]));
  if(bounds.minLat===bounds.maxLat){ bounds.minLat-=0.01; bounds.maxLat+=0.01; }
  if(bounds.minLng===bounds.maxLng){ bounds.minLng-=0.01; bounds.maxLng+=0.01; }
  const svg = svgEl('svg', {viewBox:`0 0 ${W} ${H}`, width:'100%', height:'260', style:'display:block;'});
  const bg = svgEl('rect', {x:0,y:0,width:W,height:H,rx:8,fill:'var(--surface-2)'}); svg.appendChild(bg);
  const tooltip = getTooltipEl();
  clients.forEach(c=>{
    const [x,y] = projectGeo(c.lng, c.lat, bounds, W, H, PAD);
    const isProspect = c.statut==='prospect';
    const v = visiteToday(c.id, c.commercialId);
    const isAValider = c.statut==='a_valider';
    const color = v ? (v.statut==='vendu'?'var(--good)':'var(--critical)') : clientPrimaryZoneColor(c.secteur);
    const dot = svgEl('circle', {cx:x,cy:y,r: c.aFrigo?7:5.5, fill: (isProspect||isAValider)?'none':color,
      stroke: isProspect?'var(--warning)':(isAValider?'var(--accent)':'var(--surface)'), 'stroke-width': (isProspect||isAValider)?2.5:2,
      'stroke-dasharray': isProspect?'2,2':'none', style:'cursor:pointer;'});
    if(isProspect) dot.setAttribute('fill', 'var(--warning-soft)');
    if(isAValider) dot.setAttribute('fill', 'var(--accent-soft)');
    dot.addEventListener('mousemove', e=>showTooltip(tooltip, e, `${c.nom} — ${c.zone||c.secteur||''}${c.aFrigo?' · frigo':''}${isProspect?' · prospect':''}${isAValider?' · en attente Direction':''}`));
    dot.addEventListener('mouseleave', ()=>hideTooltip(tooltip));
    dot.addEventListener('click', ()=>openClientModal(c.id, user));
    svg.appendChild(dot);
  });
  container.appendChild(svg);
  const legend = document.createElement('div');
  legend.style.cssText='display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--text-secondary);';
  legend.innerHTML = `<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:4px;"></span>Vendu aujourd'hui</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--critical);margin-right:4px;"></span>Non vendu aujourd'hui</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--text-muted);margin-right:4px;"></span>Pas encore visité · gros point = frigo</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px dashed var(--warning);margin-right:4px;"></span>Prospect</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--accent);margin-right:4px;"></span>En attente ADV</span>`;
  container.appendChild(legend);
}

function renderComptesAValider(content, user){

    <div id="comptes-list"></div>
  `;
  wireDemoBanner(content);
  function apply(){
    const list = [...APP.clients.values()].filter(c=>c.statut==='a_valider')
      .sort((a,b)=> (a.venteEnAttenteDate||'') < (b.venteEnAttenteDate||'') ? 1 : -1);

    if(!list.length){ box.innerHTML = `<div class="empty-state">Aucun compte en attente de création pour l'instant.</div>`; return; }
    box.innerHTML = list.map(c=>{
      const commercial = APP.profils.get(c.commercialId);

      return `<div class="card" style="padding:14px;margin-bottom:12px;" data-card="${c.id}">
        <div class="card-head" style="margin-bottom:8px;">
          <div><div class="card-title" style="margin:0;">${escapeHtml(c.nom)}</div>
            <span class="helptext">${escapeHtml(c.secteur||'—')} · ${escapeHtml(c.zone||'—')} · ${escapeHtml(c.telephone||'—')}</span></div>
          <span class="status-pill muted">Vente en attente depuis le ${c.venteEnAttenteDate?fmtDateFR(c.venteEnAttenteDate):'—'}</span>
        </div>
        <div class="helptext" style="margin-bottom:10px;">
          Commercial : <b>${commercial?escapeHtml(commercial.nom):'non assigné'}</b>
          ${c.origineProspection==='superviseur'?' · prospect transmis par le superviseur':' · prospection terrain'}
          ${vente?` · première vente : ${fmtFCFA(vente.montantTotal)}`:''}
        </div>
        ${isAdv ? `<div class="dyn-row">
          <input type="text" placeholder="Code client (ex : CLTDIV1234)" id="code-input-${c.id}" style="text-transform:uppercase;">
          <button class="btn primary sm" data-create="${c.id}">${icon('idcard')} Créer le compte</button>
        </div>` : ''}
      </div>`;
    }).join('');
    if(isAdv) box.querySelectorAll('[data-create]').forEach(btn=>btn.addEventListener('click', async ()=>{
      const cid = btn.getAttribute('data-create');
      const input = box.querySelector(`#code-input-${cid}`);
      const code = input.value.trim().toUpperCase();
      if(!code){ toast('Saisissez un code client.', 'warning'); return; }
      const exists = [...APP.clients.values()].some(cl=>cl.id!==cid && cl.code===code);
      if(exists){ toast('Ce code est déjà utilisé par un autre client.', 'critical'); return; }
      btn.disabled = true; btn.textContent = 'Création…';
      try{
        await APP.db.doc(`clients/${cid}`).update({code, statut:'actif', dateActivation: todayISO(), activePar: user.id});

        apply();
      }catch(e){ toast('Échec de la création du compte.', 'critical'); btn.disabled=false; btn.textContent='Créer le compte'; }
    }));
  }
  apply();
}

/* ============================== TOOLTIP ============================== */
function getTooltipEl(){
  let t = document.getElementById('chart-tooltip');
  if(!t){ t = document.createElement('div'); t.id='chart-tooltip'; t.className='tooltip'; t.style.display='none'; document.body.appendChild(t); }
  return t;
}
function showTooltip(t, evt, text){ t.textContent=text; t.style.display='block'; t.style.left=(evt.clientX+12)+'px'; t.style.top=(evt.clientY+12)+'px'; }
function hideTooltip(t){ t.style.display='none'; }

/* ============================== FICHE DE SUIVI (SUPERVISEUR) ============================== */
function renderDynList(container, arr, fields){
  container.innerHTML = arr.map((item,i)=>`<div class="dyn-row">
    ${fields.map(f=>`<input type="text" placeholder="${f.ph}" data-i="${i}" data-f="${f.k}" value="${escapeHtml(item[f.k]||'')}">`).join('')}
    <button class="icon-btn" data-rm="${i}">${icon('x')}</button>
  </div>`).join('');
  container.querySelectorAll('input').forEach(inp=>inp.addEventListener('input', e=>{ arr[e.target.getAttribute('data-i')][e.target.getAttribute('data-f')] = e.target.value; }));
  container.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click', ()=>{ arr.splice(Number(b.getAttribute('data-rm')),1); renderDynList(container, arr, fields); }));
}
function buildProduitsChecklist(container){
  const chosen = new Set();
  [...APP.produits.values()].forEach(p=>{
    const it = document.createElement('div'); it.className='checklist-item'; it.textContent = p.nom;
    it.addEventListener('click', ()=>{ if(chosen.has(p.id)){chosen.delete(p.id);it.classList.remove('on');} else {chosen.add(p.id);it.classList.add('on');} });
    container.appendChild(it);
  });
  return chosen;
}
function buildConcurrentsChecklist(container){
  const chosen = new Set();
  CONCURRENTS.forEach(nom=>{
    const it = document.createElement('div'); it.className='checklist-item'; it.textContent = nom;
    it.addEventListener('click', ()=>{ if(chosen.has(nom)){chosen.delete(nom);it.classList.remove('on');} else {chosen.add(nom);it.classList.add('on');} });
    container.appendChild(it);
  });
  return chosen;
}
function wireGpsCapture(box, btnSel, boxSel){
  let gps = { value: null };
  box.querySelector(btnSel).addEventListener('click', ()=>{
    if(!navigator.geolocation){ toast('Géolocalisation indisponible.', 'warning'); return; }
    navigator.geolocation.getCurrentPosition(pos=>{
      gps.value = {lat:pos.coords.latitude, lng:pos.coords.longitude};
      box.querySelector(boxSel).innerHTML = `<span class="status-pill good">✓ Position capturée</span>`;
    }, err=>toast('Position indisponible : '+(err.message||'refusée'), 'warning'), {timeout:8000});
  });
  return gps;
}

function renderJournalSuperviseur(content, user){
  content.innerHTML = `
    ${demoBannerHTML()}
    <div class="page-head">
      <div><h1>Journal d'activité</h1><p class="page-sub">Historique complet de vos passages : clients visités, produits relevés et prospects transmis — pour évaluer votre activité terrain.</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <select id="j-zone"><option value="">Tous les secteurs</option>${secteursForEquipe(user).map(s=>`<option>${escapeHtml(s)}</option>`).join('')}</select>
        <select id="j-mode"><option value="">Tous les modes</option><option value="avec_commercial">Avec commercial — client existant</option><option value="avec_commercial_prospection">Avec commercial — prospection</option><option value="seul">Seul(e) — client existant</option><option value="seul_prospection">Seul(e) — prospection</option></select>
        ${dateRangeHTML('j', periodCutoff(30), todayISO())}
        <button class="btn ghost" id="j-export-pdf">${icon('pdf')} PDF</button>
        <button class="btn primary" id="j-export-excel">${icon('download')} Exporter Excel</button>
      </div>
    </div>
    <div class="kpi-grid" id="j-kpis" style="margin-bottom:16px;"></div>
    <div class="card"><div class="table-wrap" id="j-table"></div></div>
  `;
  wireDemoBanner(content);
  let lastRows = [];
  function apply(from, to){
    const rangeFrom = from!==undefined ? from : (content.querySelector('#j-from').value||periodCutoff(30));
    const rangeTo = to!==undefined ? to : (content.querySelector('#j-to').value||todayISO());
    const zone = content.querySelector('#j-zone').value;
    const mode = content.querySelector('#j-mode').value;
    let rows = fichesForSuperviseur(user.id).filter(f=>f.date>=rangeFrom && f.date<=rangeTo);
    if(mode) rows = rows.filter(f=>f.modeVisite===mode);
    if(zone) rows = rows.filter(f=>{ const c=APP.clients.get(f.clientId); return c && c.secteur===zone; });
    lastRows = rows;
    renderKpis(rows); renderTable(rows);
  }
  function renderKpis(rows){
    const box = content.querySelector('#j-kpis');
    const prospections = rows.filter(f=>isProspectionMode(f.modeVisite)).length;
    const suivis = rows.filter(f=>!isProspectionMode(f.modeVisite));
    const verifies = suivis.filter(f=>f.commercialVerifie).length;
    const tauxVerif = suivis.length ? Math.round(verifies/suivis.length*100) : 0;
    const produitsTotal = rows.reduce((s,f)=>s+(f.produitsPresents||[]).length,0);
    box.innerHTML = `
      <div class="kpi-tile"><div class="kpi-label">Passages enregistrés</div><div class="kpi-value">${rows.length}</div></div>
      <div class="kpi-tile"><div class="kpi-label">Clients existants visités</div><div class="kpi-value">${suivis.length}</div></div>
      <div class="kpi-tile"><div class="kpi-label">Nouveaux prospects transmis</div><div class="kpi-value">${prospections}</div></div>
      <div class="kpi-tile"><div class="kpi-label">Taux de vérification commercial</div><div class="kpi-value">${tauxVerif}%</div></div>
      <div class="kpi-tile"><div class="kpi-label">Relevés produits cumulés</div><div class="kpi-value">${produitsTotal}</div></div>
    `;
  }
  function renderTable(rows){
    const box = content.querySelector('#j-table');
    if(!rows.length){ box.innerHTML = `<div class="empty-state">Aucune fiche pour cette période / ces filtres.</div>`; return; }
    box.innerHTML = `<table><thead><tr><th>Date</th><th>Mode</th><th>Secteur</th><th>Point de vente</th><th>Type</th><th>Commercial concerné</th><th>Produits relevés</th><th>Concurrence</th><th>Vérifié</th><th>Position</th><th>Notes</th></tr></thead><tbody>
      ${rows.map(f=>{
        const c = APP.clients.get(f.clientId);
        const co = APP.profils.get(f.commercialId);
        const type = isProspectionMode(f.modeVisite) ? '<span class="status-pill warning">Nouveau prospect</span>' : '<span class="status-pill good">Client existant</span>';
        const verif = isProspectionMode(f.modeVisite) ? '—' : (f.commercialVerifie ? '<span class="status-pill good">✓ Oui</span>' : '<span class="status-pill critical">Non</span>');
        const pos = f.gps ? '<span class="status-pill good">✓ Capturée</span>' : '—';
        return `<tr data-client="${f.clientId}"><td>${fmtDateFR(f.date)}</td><td>${modeVisiteLabel(f.modeVisite)}</td><td>${c?escapeHtml(c.secteur||''):'—'}</td>
          <td>${c?escapeHtml(c.nom):'—'}</td><td>${type}</td><td>${co?escapeHtml(co.nom):'—'}</td>
          <td class="num">${(f.produitsPresents||[]).length}</td>
          <td class="helptext" style="max-width:180px;white-space:normal;">${escapeHtml((f.concurrence||'').slice(0,100))||'—'}</td>
          <td>${verif}</td><td>${pos}</td>
          <td class="helptext" style="max-width:220px;white-space:normal;">${escapeHtml((f.notes||'').slice(0,120))}</td></tr>`;
      }).join('')}
    </tbody></table>`;
    box.querySelectorAll('tr[data-client]').forEach(row=>row.addEventListener('click', ()=>openClientModal(row.getAttribute('data-client'), user)));
  }
  content.querySelector('#j-zone').addEventListener('change', ()=>apply());
  content.querySelector('#j-mode').addEventListener('change', ()=>apply());
  wireDateRange(content, 'j', apply);
  content.querySelector('#j-export-pdf').addEventListener('click', ()=>exportJournalSuperviseurPDF(user, lastRows));
  content.querySelector('#j-export-excel').addEventListener('click', ()=>exportJournalSuperviseurExcel(user, lastRows));
  apply();
}

async function exportJournalSuperviseurPDF(user, rows){
  if(typeof window.jspdf === 'undefined'){ toast('Bibliothèque PDF non chargée. Vérifiez votre connexion.', 'critical'); return; }
  if(!rows.length){ toast('Aucune donnée à exporter pour ces filtres.', 'warning'); return; }
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const marginX = 36; let y = 50;
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text('Route to Market — Journal d\'activité superviseur', marginX, y); y+=22;
    doc.setFontSize(11); doc.setFont('helvetica','normal');
    doc.text(`Superviseur : ${user.nom}`, marginX, y); y+=16;
    doc.text(`Période couverte : ${fmtDateFR(rows[rows.length-1].date)} → ${fmtDateFR(rows[0].date)}`, marginX, y); y+=16;
    const prospections = rows.filter(f=>isProspectionMode(f.modeVisite)).length;
    doc.text(`${rows.length} passage(s) — ${prospections} nouveau(x) prospect(s) transmis`, marginX, y); y+=24;
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
    const cols = [['Date',marginX],['Mode',marginX+58],['Point de vente',marginX+140],['Type',marginX+270],['Commercial',marginX+345],['Produits',marginX+430],['Vérifié',marginX+490]];
    cols.forEach(([label,x])=>doc.text(label,x,y));
    y+=6; doc.setLineWidth(0.5); doc.line(marginX, y, 558, y); y+=13;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.7);
    rows.forEach(f=>{
      if(y>770){ doc.addPage(); y=50; }
      const c = APP.clients.get(f.clientId);
      const co = APP.profils.get(f.commercialId);
      const type = isProspectionMode(f.modeVisite) ? 'Nvx prospect' : 'Client existant';
      const verif = isProspectionMode(f.modeVisite) ? '—' : (f.commercialVerifie ? 'Oui' : 'Non');
      doc.text(fmtDateFR(f.date), marginX, y);
      doc.text(modeVisiteLabel(f.modeVisite, true), marginX+58, y);
      doc.text(String(c?c.nom:'—').slice(0,22), marginX+140, y);
      doc.text(type, marginX+270, y);
      doc.text(String(co?co.nom:'—').slice(0,16), marginX+345, y);
      doc.text(String((f.produitsPresents||[]).length), marginX+430, y);
      doc.text(verif, marginX+490, y);
      y+=14;
    });
    const filename = `journal-superviseur-${(user.nom||'superviseur').replace(/\s+/g,'_')}-${todayISO()}.pdf`;
    if(APP.downloads){ const blob = doc.output('blob'); await APP.downloads.save({filename, data: blob}); toast('Journal PDF enregistré.', 'good'); }
    else { doc.save(filename); toast('Journal PDF téléchargé.', 'good'); }
  }catch(e){
    if(e && e.code==='declined'){ /* silencieux */ }
    else { console.error(e); toast('Export PDF impossible : '+(e&&e.message?e.message:'erreur inconnue'), 'critical'); }
  }
}

async function exportJournalSuperviseurExcel(user, rows){
  if(!APP.downloads){ toast('Export indisponible dans ce navigateur.', 'warning'); return; }
  if(typeof XLSX === 'undefined'){ toast('Bibliothèque Excel non chargée.', 'critical'); return; }
  if(!rows.length){ toast('Aucune donnée à exporter pour ces filtres.', 'warning'); return; }
  try{
    const sheetRows = rows.map(f=>{
      const c = APP.clients.get(f.clientId); const co = APP.profils.get(f.commercialId);
      return {
        Date: f.date, Mode: modeVisiteLabel(f.modeVisite), Secteur: c?c.secteur:'', Zone: c?c.zone:'', PointDeVente: c?c.nom:'',
        Type: isProspectionMode(f.modeVisite)?'Nouveau prospect':'Client existant',
        CommercialConcerne: co?co.nom:'', ProduitsReleves: (f.produitsPresents||[]).map(id=>(APP.produits.get(id)||{}).nom).join(', '),
        Concurrence: f.concurrence||'',
        CommercialVerifie: isProspectionMode(f.modeVisite)?'—':(f.commercialVerifie?'Oui':'Non'),
        Position: f.gps?'Capturée':'Non capturée', Notes: f.notes||'',
      };
    });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, sheetFromRows(sheetRows), 'Journal_Superviseur');
    const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const blob = new Blob([wbout], {type:'application/octet-stream'});
    await APP.downloads.save({filename:`journal-superviseur-${(user.nom||'superviseur').replace(/\s+/g,'_')}-${todayISO()}.xlsx`, data: blob});
    toast('Journal Excel enregistré.', 'good');
  }catch(e){
    if(e && e.code==='declined'){ /* silencieux */ }
    else { console.error(e); toast('Export impossible : '+(e && e.message ? e.message : 'erreur inconnue'), 'critical'); }
  }
}

    const box = backdrop.querySelector('#chist-detail');

    const day = mine.filter(v=>v.date===selected).sort((a,b)=> (a.timestamp||'')<(b.timestamp||'')?-1:1);

      <div class="kpi-tile"><div class="kpi-label">Nouveaux clients</div><div class="kpi-value">${nouveaux}</div><div class="kpi-sub">sur la période</div></div>
      <div class="kpi-tile"><div class="kpi-label">Clients avec frigo</div><div class="kpi-value">${withFrigo}%</div><div class="kpi-sub">${baseClients.filter(c=>c.aFrigo).length}/${baseClients.length}</div></div>
      <div class="kpi-tile"><div class="kpi-label">Objectif atteint (moy.)</div><div class="kpi-value">${objAvg}%</div><div class="kpi-sub">mois en cours</div></div>
    </div>
    <div class="grid-2">
      <div class="card"><div class="card-title" style="margin-bottom:10px;">Évolution du CA</div><div id="chart-line"></div></div>
      <div class="card"><div class="card-title" style="margin-bottom:10px;">Raisons de non-achat</div><div id="chart-raisons"></div></div>
      ${f.isAll && !f.commercialId ? `<div class="card"><div class="card-title" style="margin-bottom:10px;">CA par commercial</div><div id="chart-commercial"></div></div>` : ''}
      <div class="card"><div class="card-title" style="margin-bottom:10px;">CA par secteur</div><div id="chart-zone"></div></div>
      <div class="card"><div class="card-title" style="margin-bottom:10px;">Top 10 clients (CA)</div><div id="chart-top"></div></div>
      <div class="card"><div class="card-title" style="margin-bottom:10px;">Équipement frigo</div><div id="chart-frigo"></div></div>
    </div>
    <div class="card"><div class="card-title" style="margin-bottom:10px;">Objectif vs réalisé par client (mois en cours)</div><div class="table-wrap" id="obj-table"></div></div>
  `;

  // Evolution CA (line)

  const days = Object.keys(byDate).sort();

  const raisonCounts = {};

    drawBarChartH(box.querySelector('#chart-commercial'), Object.entries(byCom).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value), fmtFCFA, 'var(--s1)');

  const byZone = {};
  vendues.forEach(v=>{ const c = APP.clients.get(v.clientId); const s = c?c.secteur:'—'; byZone[s]=(byZone[s]||0)+v.montantTotal; });
  drawBarChartH(box.querySelector('#chart-zone'), SECTEUR_NAMES.filter(s=>byZone[s]).map(s=>({label:s, value:byZone[s]||0})), fmtFCFA, 'var(--s3)');

  const byClient = {};
  vendues.forEach(v=>{ const c = APP.clients.get(v.clientId); if(!c) return; byClient[c.nom]=(byClient[c.nom]||0)+v.montantTotal; });

  const objTable = box.querySelector('#obj-table');
  const rows = baseClients.map(c=>{
    const objectif = suggestObjective(c.id);
    const realise = realizedForClientMonth(c.id, ym);
    const pct = Math.min(100, Math.round(realise/Math.max(objectif,1)*100));
    return {nom:c.nom, zone:c.zone, objectif, realise, pct};
  }).sort((a,b)=>b.pct-a.pct);
  objTable.innerHTML = rows.length ? `<table><thead><tr><th>Client</th><th>Zone</th><th>Objectif</th><th>Réalisé</th><th>Progression</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${escapeHtml(r.nom)}</td><td>${escapeHtml(r.zone)}</td><td class="num">${fmtNum(r.objectif)}</td><td class="num">${fmtNum(r.realise)}</td>

  </tbody></table>` : `<div class="empty-state">Aucune donnée pour ce filtre.</div>`;
}

/* ---- chart primitives ---- */
function chartFrame(container, h){
  container.innerHTML = '';
  const svg = svgEl('svg', {viewBox:`0 0 640 ${h}`, width:'100%', height:h, style:'display:block;overflow:visible;'});
  container.appendChild(svg);
  return svg;
}
function drawBarChartH(container, data, fmt, color){
  if(!data.length || data.every(d=>!d.value)){ container.innerHTML = `<div class="chart-empty">Aucune donnée sur la période.</div>`; return; }
  const rowH = 30, top=6, labelW=150, chartW=640-labelW-70;
  const h = data.length*rowH + top*2;
  const svg = chartFrame(container, h);
  const max = Math.max(...data.map(d=>d.value), 1);
  const tooltip = getTooltipEl();
  data.forEach((d,i)=>{
    const y = top + i*rowH;
    const label = svgEl('text', {x:labelW-10, y:y+rowH/2+4, 'text-anchor':'end', 'font-size':11.5, fill:'var(--text-secondary)'});
    label.textContent = d.label.length>22 ? d.label.slice(0,21)+'…' : d.label;
    svg.appendChild(label);
    const track = svgEl('rect', {x:labelW, y:y+6, width:chartW, height:14, rx:4, fill:'var(--surface-3)'});
    svg.appendChild(track);
    const w = Math.max(2,(d.value/max)*chartW);
    const bar = svgEl('rect', {x:labelW, y:y+6, width:w, height:14, rx:4, fill:color, style:'cursor:pointer;'});
    bar.addEventListener('mousemove', e=>showTooltip(tooltip, e, `${d.label}: ${fmt(d.value)}`));
    bar.addEventListener('mouseleave', ()=>hideTooltip(tooltip));
    svg.appendChild(bar);
    const val = svgEl('text', {x:labelW+w+8, y:y+rowH/2+4, 'font-size':11.5, fill:'var(--text-primary)', class:'num'});
    val.textContent = typeof fmt==='function' ? fmt(d.value).replace(' FCFA','') : d.value;
    svg.appendChild(val);
  });
}
function drawLineChart(container, points, fmt){
  if(!points.length){ container.innerHTML = `<div class="chart-empty">Aucune donnée sur la période.</div>`; return; }
  const W=640,H=220,PAD={l:56,r:16,t:14,b:28};
  const svg = chartFrame(container, H);
  const max = Math.max(...points.map(p=>p.y),1);
  const innerW = W-PAD.l-PAD.r, innerH = H-PAD.t-PAD.b;
  [0,0.5,1].forEach(f=>{
    const y = PAD.t + innerH*(1-f);
    svg.appendChild(svgEl('line',{x1:PAD.l,x2:W-PAD.r,y1:y,y2:y,stroke:'var(--grid)','stroke-width':1}));
    const t = svgEl('text',{x:PAD.l-8,y:y+4,'text-anchor':'end','font-size':10.5,fill:'var(--text-muted)'});
    t.textContent = fmtNum(max*f); svg.appendChild(t);
  });
  const pts = points.map((p,i)=>({ x: PAD.l + (points.length>1 ? i/(points.length-1)*innerW : innerW/2), y: PAD.t + innerH*(1-p.y/max), ...p }));
  const areaPath = `M${pts[0].x},${PAD.t+innerH} ` + pts.map(p=>`L${p.x},${p.y}`).join(' ') + ` L${pts[pts.length-1].x},${PAD.t+innerH} Z`;
  svg.appendChild(svgEl('path',{d:areaPath, fill:'var(--accent)', opacity:0.12}));
  const linePath = `M`+pts.map(p=>`${p.x},${p.y}`).join(' L ');
  svg.appendChild(svgEl('path',{d:linePath, fill:'none', stroke:'var(--accent)', 'stroke-width':2, 'stroke-linejoin':'round','stroke-linecap':'round'}));
  const tooltip = getTooltipEl();
  const every = Math.max(1, Math.floor(pts.length/7));
  pts.forEach((p,i)=>{
    if(i%every===0 || i===pts.length-1){
      const t = svgEl('text',{x:p.x,y:H-8,'text-anchor':'middle','font-size':10,fill:'var(--text-muted)'});
      t.textContent = fmtDateFR(p.x).slice(0,5);
      svg.appendChild(t);
    }
    const dot = svgEl('circle',{cx:p.x,cy:p.y,r:8,fill:'transparent',style:'cursor:pointer;'});
    dot.addEventListener('mousemove', e=>showTooltip(tooltip, e, `${fmtDateFR(p.x)}: ${fmt(p.y)}`));
    dot.addEventListener('mouseleave', ()=>hideTooltip(tooltip));
    svg.appendChild(dot);
    svg.appendChild(svgEl('circle',{cx:p.x,cy:p.y,r:3,fill:'var(--accent)'}));
  });
}
function drawTwoBar(container, a, b){
  const W=640,H=140,PAD=40; const svg = chartFrame(container,H);
  const max = Math.max(a.value,b.value,1);
  const barW=120, gap=90, startX=W/2-gap-barW/2+10;
  [a,b].forEach((d,i)=>{
    const x = startX + i*(barW+gap);
    const bh = Math.max(4,(d.value/max)*(H-50));
    const y = H-30-bh;
    svg.appendChild(svgEl('rect',{x,y,width:barW,height:bh,rx:6,fill:d.color}));
    const val = svgEl('text',{x:x+barW/2,y:y-8,'text-anchor':'middle','font-size':14,'font-weight':700,fill:'var(--text-primary)'});
    val.textContent = d.value; svg.appendChild(val);
    const lab = svgEl('text',{x:x+barW/2,y:H-10,'text-anchor':'middle','font-size':11.5,fill:'var(--text-secondary)'});
    lab.textContent = d.label; svg.appendChild(lab);
  });
}

/* ============================== EXCEL EXPORT ============================== */
function sheetFromRows(rows){ return XLSX.utils.json_to_sheet(rows); }
async function exportExcel(){
  if(!APP.downloads){ toast("Export indisponible dans ce navigateur.", 'warning'); return; }
  if(typeof XLSX === 'undefined'){ toast('Bibliothèque Excel non chargée.', 'critical'); return; }
  try{
    const wb = XLSX.utils.book_new();
    const clientsRows = [...APP.clients.values()].map(c=>({
      Code:c.code||'', Nom:c.nom, Secteur:c.secteur||'', Zone:c.zone||'', Adresse:c.adresse||'', Telephone:c.telephone||'', Frigo:c.aFrigo?'Oui':'Non',
      Commercial: (APP.profils.get(c.commercialId)||{}).nom||'', ObjectifMensuel:c.objectifMensuel||'',
      NombreVisites:c.nombreVisites||'', JoursVisite:(c.joursVisite||[]).join(', '), Statut:c.statut,
      Verifie: c.statut==='actif' ? (isClientVerified(c)?'Oui':'Non') : '—',
      Origine: c.origineProspection==='superviseur'?'Prospection superviseur':'Terrain',
      DateCreation:c.dateCreation||'', Latitude:c.lat, Longitude:c.lng,
    }));
    const visitesRows = [...APP.visites.values()].map(v=>({
      Date:v.date, Client:(APP.clients.get(v.clientId)||{}).nom||'', Commercial:(APP.profils.get(v.commercialId)||{}).nom||'',
      Statut:v.statut, Montant:v.montantTotal||0, Raison:v.raisonNonAchat||'',
      Produits:(v.produitsVendus||[]).map(id=>(APP.produits.get(id)||{}).nom||id).join(', '),
      Concurrence: v.concurrence||'',
      DistanceGPS_m: v.gps?v.gps.distanceM:'',
    }));
    const fichesRows = [...APP.fiches.values()].map(f=>({
      Date:f.date, Superviseur:(APP.profils.get(f.superviseurId)||{}).nom||'', Commercial:(APP.profils.get(f.commercialId)||{}).nom||'',
      Client:(APP.clients.get(f.clientId)||{}).nom||'', CommercialVerifie:f.commercialVerifie?'Oui':'Non',
      ProduitsPresents:(f.produitsPresents||[]).map(id=>(APP.produits.get(id)||{}).nom).join(', '),
      Concurrence: f.concurrence||'',
      Prospectes:(f.clientsProspectes||[]).map(p=>p.nom).join(', '), NouveauxClients:(f.nouveauxClients||[]).map(n=>n.nom).join(', '),
      Notes:f.notes||'',
    }));
    const ym = todayDate().getFullYear()+'-'+pad2(todayDate().getMonth()+1);
    const objRows = [...APP.clients.values()].map(c=>({
      Client:c.nom, Zone:c.zone, Commercial:(APP.profils.get(c.commercialId)||{}).nom||'',
      ObjectifMensuel:suggestObjective(c.id), RealiseMoisEnCours: realizedForClientMonth(c.id, ym),
    }));
    const prospectsRows = [...APP.clients.values()].filter(c=>c.statut==='prospect' || c.origineProspection).map(c=>{
      const visites = visitesForClient(c.id); const vendues = visites.filter(v=>v.statut==='vendu');
      return {
        Nom:c.nom, Zone:c.zone, Commercial:(APP.profils.get(c.commercialId)||{}).nom||'',
        Origine: c.origineProspection==='superviseur' ? 'Transmis par '+((APP.profils.get(c.superviseurId)||{}).nom||'superviseur') : 'Terrain',
        DateCreation:c.dateCreation||'', Statut:c.statut, NbVisites:visites.length,
        DerniereVisite: visites.length?visites[0].date:'', CAGenere: vendues.reduce((s,v)=>s+v.montantTotal,0),
      };
    });
    const vendues = [...APP.visites.values()].filter(v=>v.statut==='vendu');
    const kpiRows = [
      {Indicateur:"Chiffre d'affaires total", Valeur: vendues.reduce((s,v)=>s+v.montantTotal,0)},
      {Indicateur:"Nombre de passages enregistrés", Valeur: APP.visites.size},
      {Indicateur:"Nombre de ventes conclues", Valeur: vendues.length},
      {Indicateur:"Nombre de clients actifs", Valeur: [...APP.clients.values()].filter(c=>c.statut==='actif').length},
      {Indicateur:"Clients avec frigo", Valeur: [...APP.clients.values()].filter(c=>c.aFrigo).length},
      {Indicateur:"Date d'export", Valeur: todayISO()},
    ];
    XLSX.utils.book_append_sheet(wb, sheetFromRows(clientsRows), 'Clients');
    XLSX.utils.book_append_sheet(wb, sheetFromRows(visitesRows), 'Ventes_Visites');
    XLSX.utils.book_append_sheet(wb, sheetFromRows(fichesRows), 'Fiches_Superviseur');
    XLSX.utils.book_append_sheet(wb, sheetFromRows(prospectsRows), 'Journal_Prospects');
    XLSX.utils.book_append_sheet(wb, sheetFromRows(objRows), 'Objectifs');
    XLSX.utils.book_append_sheet(wb, sheetFromRows(kpiRows), 'KPIs');
    const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const blob = new Blob([wbout], {type:'application/octet-stream'});
    await APP.downloads.save({filename:`route-to-market-${todayISO()}.xlsx`, data: blob});
    toast('Fichier Excel enregistré.', 'good');
  }catch(e){
    if(e && e.code==='declined'){ /* silent */ }
    else { console.error(e); toast('Export impossible : '+(e && e.message ? e.message : 'erreur inconnue'), 'critical'); }
  }
}

boot();
