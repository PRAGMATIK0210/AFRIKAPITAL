      if(exists){ toast('Ce code est déjà utilisé par un autre client.', 'critical'); return; }
      btn.disabled = true; btn.textContent = 'Création…';
      try{
        await APP.db.doc(`clients_rtm/${cid}`).update({code, statut:'actif', dateActivation: todayISO(), activePar: user.id});
        toast('Compte créé — le client est maintenant actif dans la base du commercial.', 'good');
        apply();
      }catch(e){ toast('Échec de la création du compte.', 'critical'); btn.disabled=false; btn.textContent='Créer le compte'; }
    }));
  }
  apply();
}

function renderActiviteGenerale(content, user){
  content.innerHTML = `
    ${demoBannerHTML()}
    <div class="page-head"><div><h1>Activité générale</h1><p class="page-sub">Vue consolidée du travail des commerciaux et des superviseurs.</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <select id="ag-secteur"><option value="">Tous les secteurs</option>${SECTEUR_NAMES.map(s=>`<option>${escapeHtml(s)}</option>`).join('')}</select>
        ${dateRangeHTML('ag', periodCutoff(30), todayISO())}
      </div>
    </div>
    <div class="kpi-grid" id="ag-kpis" style="margin-bottom:16px;"></div>
    <div class="grid-2">
      <div class="card"><div class="card-title" style="margin-bottom:10px;">Passages commerciaux récents</div><div class="table-wrap" id="ag-visites"></div></div>
      <div class="card"><div class="card-title" style="margin-bottom:10px;">Fiches superviseurs récentes</div><div class="table-wrap" id="ag-fiches"></div></div>
    </div>
  `;
  wireDemoBanner(content);
  function apply(from, to){
    const sinceISO = from!==undefined ? from : (content.querySelector('#ag-from').value||periodCutoff(30));
    const toISO = to!==undefined ? to : (content.querySelector('#ag-to').value||todayISO());
    const secteur = content.querySelector('#ag-secteur').value;
    let visites = filteredVisites({secteur, sinceISO, toISO}).sort((a,b)=> a.date<b.date?1:-1);
    let fiches = [...APP.fiches.values()].filter(f=>{
      if(f.date < sinceISO || f.date > toISO) return false;
      if(secteur){ const c = APP.clients.get(f.clientId); if(!c || c.secteur!==secteur) return false; }
      return true;
    }).sort((a,b)=> a.date<b.date?1:-1);

    const vendues = visites.filter(v=>v.statut==='vendu');
    const ca = vendues.reduce((s,v)=>s+v.montantTotal,0);
    const clientsScope = secteur ? [...APP.clients.values()].filter(c=>c.secteur===secteur) : [...APP.clients.values()];
    const actifs = clientsScope.filter(c=>c.statut==='actif');
    const nonVerifies = actifs.filter(c=>!isClientVerified(c)).length;
    const enAttente = clientsScope.filter(c=>c.statut==='a_valider').length;
    const verifTaux = fiches.length ? Math.round(fiches.filter(f=>f.commercialVerifie).length/fiches.length*100) : 0;
    const nbCommerciaux = new Set(visites.map(v=>v.commercialId)).size;
    const nbSuperviseurs = new Set(fiches.map(f=>f.superviseurId)).size;

    content.querySelector('#ag-kpis').innerHTML = `
      <div class="kpi-tile"><div class="kpi-label">Chiffre d'affaires</div><div class="kpi-value">${fmtNum(ca)}</div><div class="kpi-sub">FCFA sur la période</div></div>
      <div class="kpi-tile"><div class="kpi-label">Passages commerciaux</div><div class="kpi-value">${visites.length}</div><div class="kpi-sub">${nbCommerciaux} commercial(aux) actif(s)</div></div>
      <div class="kpi-tile"><div class="kpi-label">Fiches superviseurs</div><div class="kpi-value">${fiches.length}</div><div class="kpi-sub">${nbSuperviseurs} superviseur(s)</div></div>
      <div class="kpi-tile"><div class="kpi-label">Taux de vérification terrain</div><div class="kpi-value">${verifTaux}%</div><div class="kpi-sub">présence commerciale confirmée</div></div>
      <div class="kpi-tile"><div class="kpi-label">Clients non vérifiés</div><div class="kpi-value">${nonVerifies}</div><div class="kpi-sub">fiche client incomplète</div></div>
      <div class="kpi-tile"><div class="kpi-label">Comptes en attente</div><div class="kpi-value">${enAttente}</div><div class="kpi-sub">à créer par l'ADV</div></div>
    `;

    const vBox = content.querySelector('#ag-visites');
    const vRows = visites.slice(0,60);
    vBox.innerHTML = vRows.length ? `<table><thead><tr><th>Date</th><th>Commercial</th><th>Client</th><th>Statut</th><th>Montant</th></tr></thead><tbody>
      ${vRows.map(v=>{ const co=APP.profils.get(v.commercialId); const cl=APP.clients.get(v.clientId);
        return `<tr data-client="${v.clientId}" style="cursor:pointer;"><td>${fmtDateFR(v.date)}</td><td>${co?escapeHtml(co.nom):'—'}</td><td>${cl?escapeHtml(cl.nom):'—'}</td>
        <td>${v.statut==='vendu'?'<span class="status-pill good">Vendu</span>':'<span class="status-pill critical">Non vendu</span>'}</td>
        <td class="num">${v.statut==='vendu'?fmtFCFA(v.montantTotal):'—'}</td></tr>`; }).join('')}
    </tbody></table>` : `<div class="empty-state">Aucun passage pour cette période / ce secteur.</div>`;
    vBox.querySelectorAll('[data-client]').forEach(row=>row.addEventListener('click', ()=>openClientModal(row.getAttribute('data-client'), user)));

    const fBox = content.querySelector('#ag-fiches');
    const fRows = fiches.slice(0,60);
    fBox.innerHTML = fRows.length ? `<table><thead><tr><th>Date</th><th>Superviseur</th><th>Commercial</th><th>Client</th><th>Mode</th><th>Concurrence</th></tr></thead><tbody>
      ${fRows.map(f=>{ const sup=APP.profils.get(f.superviseurId); const co=APP.profils.get(f.commercialId); const cl=APP.clients.get(f.clientId);
        return `<tr data-client="${f.clientId||''}" style="cursor:${f.clientId?'pointer':'default'};"><td>${fmtDateFR(f.date)}</td><td>${sup?escapeHtml(sup.nom):'—'}</td><td>${co?escapeHtml(co.nom):'—'}</td>
        <td>${cl?escapeHtml(cl.nom):'—'}</td><td>${modeVisiteLabel(f.modeVisite, true)}</td>
        <td class="helptext" style="max-width:160px;white-space:normal;">${escapeHtml((f.concurrence||'').slice(0,90))||'—'}</td></tr>`; }).join('')}
    </tbody></table>` : `<div class="empty-state">Aucune fiche pour cette période / ce secteur.</div>`;
    fBox.querySelectorAll('[data-client]').forEach(row=>{ const cid=row.getAttribute('data-client'); if(cid) row.addEventListener('click', ()=>openClientModal(cid, user)); });
  }
  content.querySelector('#ag-secteur').addEventListener('change', ()=>apply());
  wireDateRange(content, 'ag', apply);
  apply(periodCutoff(30), todayISO());

/* ============================== SUIVI DES SUPERVISEURS (DIRECTION) ============================== */
function renderSuiviSuperviseurs(content, user){
  const superviseurs = [...APP.profils.values()].filter(p=>p.role==='superviseur').sort((a,b)=> a.nom<b.nom?-1:1);
  content.innerHTML = `
    ${demoBannerHTML()}
    <div class="page-head">
      <div><h1>Suivi des superviseurs</h1><p class="page-sub">Ce que fait chaque superviseur sur le terrain : fiches renseignées, accompagnement des commerciaux, prospection, dernière activité.</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">${dateRangeHTML('sv', periodCutoff(30), todayISO())}</div>
    </div>
    <div class="kpi-grid" id="sv-kpis" style="margin-bottom:16px;"></div>
    <div id="sv-cards" class="grid-2"></div>
  `;
  wireDemoBanner(content);

  function apply(from, to){
    const sinceISO = from!==undefined ? from : (content.querySelector('#sv-from').value||periodCutoff(30));
    const toISO = to!==undefined ? to : (content.querySelector('#sv-to').value||todayISO());

    const rows = superviseurs.map(sup=>{
      const allFiches = fichesForSuperviseur(sup.id); // déjà trié du plus récent au plus ancien
      const periodFiches = allFiches.filter(f=>f.date>=sinceISO && f.date<=toISO);
      const avec = periodFiches.filter(f=>(f.modeVisite||'').startsWith('avec_commercial')).length;
      const seul = periodFiches.length - avec;
      const prospects = periodFiches.reduce((s,f)=>s+(f.clientsProspectes||[]).length, 0);
      const verifies = periodFiches.filter(f=>f.commercialVerifie).length;
      const lastDate = allFiches.length ? allFiches[0].date : null;
      const daysSince = lastDate ? daysBetween(lastDate, todayISO()) : null;
      const equipe = (sup.equipe||[]).map(id=>APP.profils.get(id)).filter(Boolean);
      const secteurs = [...new Set(equipe.map(c=>c.secteur).filter(Boolean))];
      return { sup, periodFiches, avec, seul, prospects, verifies, lastDate, daysSince, equipeSize: equipe.length, secteurs };
    }).sort((a,b)=> (b.daysSince==null?9999:b.daysSince) - (a.daysSince==null?9999:a.daysSince));

    const totalFiches = rows.reduce((s,r)=>s+r.periodFiches.length, 0);
    const totalVerifies = rows.reduce((s,r)=>s+r.verifies, 0);
    const totalProspects = rows.reduce((s,r)=>s+r.prospects, 0);
    const actifs = rows.filter(r=>r.periodFiches.length>0).length;
    const enRetard = rows.filter(r=>r.daysSince==null || r.daysSince>7).length;
    const verifTaux = totalFiches ? Math.round(totalVerifies/totalFiches*100) : 0;

    content.querySelector('#sv-kpis').innerHTML = `
      <div class="kpi-tile"><div class="kpi-label">Fiches sur la période</div><div class="kpi-value">${totalFiches}</div><div class="kpi-sub">${actifs}/${rows.length} superviseur(s) actif(s)</div></div>
      <div class="kpi-tile"><div class="kpi-label">Taux de vérification terrain</div><div class="kpi-value">${verifTaux}%</div><div class="kpi-sub">présence commerciale confirmée</div></div>
      <div class="kpi-tile"><div class="kpi-label">Prospects transmis</div><div class="kpi-value">${totalProspects}</div><div class="kpi-sub">sur la période</div></div>
      <div class="kpi-tile"><div class="kpi-label">Sans activité +7 jours</div><div class="kpi-value">${enRetard}</div><div class="kpi-sub">à relancer</div></div>
    `;

    const wrap = content.querySelector('#sv-cards');
    wrap.innerHTML = '';
    if(!rows.length){ wrap.innerHTML = `<div class="empty-state">Aucun superviseur enregistré.</div>`; return; }
    rows.forEach(r=>{
      const card = document.createElement('div'); card.className = 'card';
      const lastBadge = !r.lastDate
        ? `<div class="status-pill critical" style="display:inline-flex;">✗ Aucune fiche enregistrée</div>`
        : r.daysSince>7
          ? `<div class="status-pill warning" style="display:inline-flex;">⚠ Dernière fiche il y a ${r.daysSince} jours (${fmtDateFR(r.lastDate)})</div>`
          : `<div class="status-pill good" style="display:inline-flex;">✓ Dernière fiche ${r.daysSince===0?"aujourd'hui":r.daysSince===1?'hier':'il y a '+r.daysSince+' jours'}</div>`;
      card.innerHTML = `
        <div class="card-head"><div style="display:flex;align-items:center;gap:8px;"><div class="avatar">${initials(r.sup.nom)}</div>
          <div><div class="card-title" style="margin:0;">${escapeHtml(r.sup.nom)}</div>
            <span class="helptext">${r.equipeSize} commercial${r.equipeSize>1?'aux':''} encadré${r.equipeSize>1?'s':''}${r.secteurs.length?' · '+r.secteurs.map(escapeHtml).join(', '):''}</span></div></div>
          <button class="btn ghost sm" data-hist="${r.sup.id}">${icon('history')} Historique</button>
        </div>
        <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px;">
          <div class="kpi-tile"><div class="kpi-label">Fiches (période)</div><div class="kpi-value">${r.periodFiches.length}</div></div>
          <div class="kpi-tile"><div class="kpi-label">Avec / seul</div><div class="kpi-value" style="font-size:16px;">${r.avec} / ${r.seul}</div></div>
          <div class="kpi-tile"><div class="kpi-label">Prospects transmis</div><div class="kpi-value">${r.prospects}</div></div>
        </div>
        ${lastBadge}
      `;
      wrap.appendChild(card);
    });
    wrap.querySelectorAll('[data-hist]').forEach(btn=>btn.addEventListener('click', ()=>openSuperviseurHistoryModal(btn.getAttribute('data-hist'), user)));
  }
  wireDateRange(content, 'sv', apply);
  apply(periodCutoff(30), todayISO());
}

function openSuperviseurHistoryModal(superviseurId, viewerUser){
  const sup = APP.profils.get(superviseurId);
  if(!sup) return;
  const backdrop = document.createElement('div'); backdrop.className='modal-backdrop';
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) backdrop.remove(); });
  const mineAll = fichesForSuperviseur(superviseurId); // déjà trié du plus récent au plus ancien
  const allDatesDesc = [...new Set(mineAll.map(f=>f.date))];
  const earliest = allDatesDesc.length ? allDatesDesc[allDatesDesc.length-1] : periodCutoff(30);
  backdrop.innerHTML = `<div class="modal" style="max-width:920px;">
    <div class="modal-head">
      <div><h3>Historique — ${escapeHtml(sup.nom)}</h3>
        <p class="page-sub">${(sup.equipe||[]).length} commercial(aux) encadré(s)</p></div>
      <button class="modal-close" data-close>${icon('x')}</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;" id="shist-sub-row">
      <p class="helptext" id="shist-sub" style="margin:0;flex:1;"></p>
      ${dateRangeHTML('shist', earliest, todayISO())}
    </div>
    <div class="grid-2" style="grid-template-columns:220px 1fr;align-items:start;">
      <div class="card" style="padding:10px;">
        <div class="card-title" style="padding:4px 6px 8px;">Journées</div>
        <div id="shist-date-list" style="max-height:420px;overflow-y:auto;"></div>
      </div>
      <div class="card" id="shist-detail"></div>
    </div>
  </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('[data-close]').addEventListener('click', ()=>backdrop.remove());

  const listBox = backdrop.querySelector('#shist-date-list');
  let mine = mineAll, dates = allDatesDesc.slice();
  let selected = dates[0] || todayISO();
  function applyRange(from, to){
    mine = mineAll.filter(f=>f.date>=from && f.date<=to);
    dates = [...new Set(mine.map(f=>f.date))].sort((a,b)=> a<b?1:-1);
    backdrop.querySelector('#shist-sub').textContent = `${dates.length} journée${dates.length>1?'s':''} avec au moins une fiche enregistrée sur la période choisie.`;
    if(!dates.includes(selected)) selected = dates[0] || todayISO();
    renderList(); renderDetail();
  }
  wireDateRange(backdrop, 'shist', applyRange);
  function renderList(){
    if(!dates.length){ listBox.innerHTML = `<div class="empty-state">Aucune fiche sur cette période.</div>`; return; }
    listBox.innerHTML = dates.map(d=>{
      const day = mine.filter(f=>f.date===d);
      return `<div class="nav-item ${d===selected?'active':''}" data-date="${d}" style="flex-direction:column;align-items:flex-start;gap:2px;">
        <span>${fmtDateFR(d)}</span><span class="helptext" style="margin:0;">${day.length} fiche${day.length>1?'s':''}</span>
      </div>`;
    }).join('');
    listBox.querySelectorAll('[data-date]').forEach(el=>el.addEventListener('click', ()=>{ selected = el.getAttribute('data-date'); renderList(); renderDetail(); }));
  }
  function renderDetail(){
    const box = backdrop.querySelector('#shist-detail');
    if(!selected){ box.innerHTML = `<div class="empty-state">Sélectionnez une journée.</div>`; return; }
    const day = mine.filter(f=>f.date===selected);
    box.innerHTML = `
      <div class="card-head">
        <div><div class="card-title" style="margin:0;">Fiches du ${fmtDateFR(selected)}</div>
          <span class="helptext">${day.length} fiche${day.length>1?'s':''} ce jour-là</span></div>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Mode</th><th>Commercial</th><th>Client / prospect</th><th>Vérifié</th><th>Prospects</th><th>Concurrence</th><th>Notes</th></tr></thead><tbody>
        ${day.map(f=>{ const co=APP.profils.get(f.commercialId); const cl=APP.clients.get(f.clientId);
          const cible = cl ? escapeHtml(cl.nom) : ((f.clientsProspectes&&f.clientsProspectes[0]) ? escapeHtml(f.clientsProspectes[0].nom) : '—');
          return `<tr><td>${modeVisiteLabel(f.modeVisite, true)}</td><td>${co?escapeHtml(co.nom):'—'}</td><td>${cible}</td>
          <td>${f.commercialVerifie?'<span class="status-pill good">✓</span>':'<span class="status-pill muted">—</span>'}</td>
          <td class="num">${(f.clientsProspectes||[]).length}</td>
          <td class="helptext" style="max-width:140px;white-space:normal;">${escapeHtml((f.concurrence||'').slice(0,80))||'—'}</td>
          <td class="helptext" style="max-width:180px;white-space:normal;">${escapeHtml((f.notes||'').slice(0,100))||'—'}</td></tr>`;
        }).join('') || `<tr><td colspan="7" class="empty-state">Aucune fiche ce jour-là.</td></tr>`}
      </tbody></table></div>
    `;
  }
  applyRange(earliest, todayISO());
}

/* ============================== NOUVELLES FONCTIONS (ADV / plages de dates / etc.) ============================== */
function dateRangeHTML(idPrefix, fromISO, toISO){
  return `<div class="date-range" style="display:flex;align-items:center;gap:6px;">
    <input type="date" id="${idPrefix}-from" value="${fromISO||''}" max="${todayISO()}" title="Du">
    <span class="helptext" style="margin:0;">→</span>
    <input type="date" id="${idPrefix}-to" value="${toISO||''}" max="${todayISO()}" title="Au">
  </div>`;
}

function wireDateRange(container, idPrefix, onChange){
  const fromEl = container.querySelector('#'+idPrefix+'-from');
  const toEl = container.querySelector('#'+idPrefix+'-to');
  function apply(){
    let from = fromEl.value, to = toEl.value;
    if(from && to && from > to){ toEl.value = from; to = from; }
    onChange(from || '2000-01-01', to || todayISO());
  }
  fromEl.addEventListener('change', apply);
  toEl.addEventListener('change', apply);
}

function routeAllowed(user, route){
  return navFor(user).some(it=>it.r===route);
}

function buildConcurrentsChecklist(container){
  const chosen = new Set();
  CONCURRENTS.forEach(nom=>{
    const it = document.createElement('div'); it.className='checklist-item'; it.textContent = nom;
    it.addEventListener('click', ()=>{ if(chosen.has(nom)){chosen.delete(nom);it.classList.remove('on');} else {chosen.add(nom);it.classList.add('on');} });
    container.appendChild(it);
  });
  return chosen;
}
